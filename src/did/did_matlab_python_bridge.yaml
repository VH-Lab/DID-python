# did_matlab_python_bridge.yaml — Core DID classes
# The primary contract for the did namespace (core classes).
#
# Every public class / function in DID-MATLAB that has a Python counterpart
# is listed here together with:
#   - matlab_path            : location inside the MATLAB repo (relative to src/did/)
#   - matlab_last_sync_hash  : short SHA of the MATLAB commit last ported to Python
#   - python_path            : location inside the Python repo (relative to src/did/)
#   - python_class           : Python class name
#   - decision_log           : notes on deviations, sync dates, and rationale
#
# To check for drift, run:
#   git -C <DID-matlab> log <matlab_last_sync_hash>..HEAD -- <matlab_path>
# Any output means MATLAB has changed since the last port.

project_metadata:
  bridge_version: "1.0"
  matlab_repo: "VH-Lab/DID-matlab"
  python_repo: "VH-Lab/DID-python"
  naming_policy: "Strict MATLAB Mirror — Python names use snake_case equivalents"
  indexing_policy: "Semantic Parity (MATLAB 1-based, Python 0-based)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # -----------------------------------------------------------------------
  # did.database  (abstract base class)
  # -----------------------------------------------------------------------
  - name: database
    type: class
    matlab_path: "+did/database.m"
    matlab_last_sync_hash: "0142532"
    python_path: "did/database.py"
    python_class: "Database"
    inherits: "abc.ABC"
    out_of_sync: false
    sync_notes: >
      Schema validation was ported on 2026-08-28, closing what had been the
      largest capability gap between the two languages. Python previously had
      no document-vs-schema validation at all, so MATLAB PR #153
      (c561c13..0142532) had nothing to port into. The validator now lives in
      did/validate.py and is driven from Database.add_docs, which validates by
      default exactly as MATLAB's does, including PR #153's semantics: a
      schema-declared depends_on entry is required to be present only when the
      schema marks it mustbenotempty, optional ones may be omitted, and a
      missing optional dependency raises the opt-in
      MissingOptionalDependencyWarning gated on the
      DID_FORCE_VALIDATION_WARNINGS environment variable.

    properties:
      - name: connection
        python_name: connection
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: version
        python_name: version
        type_matlab: "any"
        type_python: "None"
        decision_log: "Placeholder in both. Synchronized 2026-03-15."

      - name: current_branch_id
        python_name: current_branch_id
        type_matlab: "string"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: frozen_branch_ids
        python_name: frozen_branch_ids
        type_matlab: "cell"
        type_python: "list"
        decision_log: >
          MATLAB uses cell array, Python uses list.
          Synchronized 2026-03-15.

      - name: dbid
        python_name: dbid
        type_matlab: "any (transient)"
        type_python: "None"
        decision_log: "Transient handle in both. Synchronized 2026-03-15."

      - name: debug
        python_name: debug
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: preferences
        python_name: preferences
        type_matlab: "(not present)"
        type_python: "dict"
        decision_log: >
          Python-only property for configuration. Not in MATLAB.

    methods:
      - name: database
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: connection
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: database(connection). Python: Database(connection, **kwargs).
          Synchronized 2026-03-15.

      - name: open
        python_name: open
        input_arguments: []
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: close
        python_name: close
        input_arguments: []
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: all_branch_ids
        python_name: all_branch_ids
        input_arguments: []
        output_arguments:
          - name: branch_ids
            type_matlab: "cell"
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: add_branch
        python_name: add_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
          - name: parent_branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: set_branch
        python_name: set_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_branch
        python_name: get_branch
        input_arguments: []
        output_arguments:
          - name: branch_id
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_branch_parent
        python_name: get_branch_parent
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: parent_id
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_sub_branches
        python_name: get_sub_branches
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: sub_branch_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: delete_branch
        python_name: delete_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: freeze_branch
        python_name: ~   # not ported
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "(not implemented)"
        decision_log: >
          Present in MATLAB. Not yet ported to Python.

      - name: is_branch_editable
        python_name: ~   # not ported
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "(not implemented)"
        decision_log: >
          Present in MATLAB. Not yet ported to Python.

      - name: display_branches
        python_name: ~   # not ported
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "(not implemented)"
        decision_log: >
          Present in MATLAB. Not yet ported to Python.
          Display/visualization helper.

      - name: all_doc_ids
        python_name: all_doc_ids
        input_arguments: []
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_doc_ids
        python_name: get_doc_ids
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: add_docs
        python_name: add_docs
        input_arguments:
          - name: document_objs
            type_matlab: "cell of did.document"
            type_python: "list[Document]"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB has options: OnDuplicate, Validate.
          Python accepts **kwargs. Synchronized 2026-03-15.

      - name: get_docs
        python_name: get_docs
        input_arguments:
          - name: document_ids
            type_matlab: "cell | char"
            type_python: "list[str] | str"
          - name: OnMissing
            type_matlab: "char name-value"
            type_python: "str"
            default: "'error'"
        output_arguments:
          - name: documents
            type_python: "list[Document]"
        decision_log: >
          MATLAB returns cell array of did.document; Python returns list.
          OnMissing behavior is the same. Synchronized 2026-03-16.

      - name: remove_docs
        python_name: remove_docs
        input_arguments:
          - name: document_ids
            type_matlab: "cell | char"
            type_python: "list[str] | str"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: search
        python_name: search
        input_arguments:
          - name: query_obj
            type_matlab: "did.query"
            type_python: "Query"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: run_sql_query
        python_name: do_run_sql_query
        input_arguments:
          - name: query_str
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: run_sql_query(query_str, returnStruct).
          Python: do_run_sql_query(query_str, params).
          Renamed in Python to match abstract method convention.
          Synchronized 2026-03-15.

      - name: open_doc
        python_name: open_doc
        python_path: "did/implementations/sqlitedb.py"
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "str"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: file_obj
            type_python: "ReadOnlyFileobj"
        decision_log: >
          Present in MATLAB database.m. Python SQLiteDB.open_doc returns
          ReadOnlyFileobj. Synchronized 2026-03-15.

      - name: exist_doc
        python_name: ~   # not ported
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "(not implemented in base)"
          - name: filename
            type_matlab: "char"
            type_python: "(not implemented in base)"
        decision_log: >
          Present in MATLAB as exist_doc(). Not yet in Python base class.
          SQLiteDB has partial support via check_exist_doc pattern.

      - name: close_doc
        python_name: ~   # not ported
        input_arguments:
          - name: file_obj
            type_matlab: "did.file.fileobj"
            type_python: "(not implemented)"
        decision_log: >
          Present in MATLAB. Python relies on garbage collection / fclose.

      - name: validate_docs
        python_name: validate_docs
        input_arguments:
          - name: document_objs
            type_matlab: "cell of did.document"
            type_python: "list[Document] | list[dict]"
        decision_log: >
          MATLAB: database.validate_docs(document_objs), called from add_docs
          when the Validate option is on. Python: Database.validate_docs(),
          called from add_docs when validate is True (the default in both).
          Both build all_ids as the superset of the document ids already in
          the database and those in the batch, so a batch may depend on
          itself; both check that each doc has a non-empty document_class
          with class_name / property_list_name / class_version, skip any doc
          whose document_class has no validation field, and otherwise load
          the schema and hand off to validate_doc_vs_schema. The per-document
          work lives in did/validate.py:validate_docs. Ported 2026-08-28.

      - name: get_document_schema
        python_name: get_document_schema
        python_path: "did/validate.py"
        input_arguments:
          - name: schema_filename
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: database.get_document_schema. Python:
          did/validate.py:get_document_schema, with the path resolution split
          out into resolve_definition_path. Both expand a $PATH placeholder
          against the definitions map and try the literal name, then
          '.schema.json', then '_schema.json'. Ported 2026-08-28.

      - name: validate_doc_vs_schema
        python_name: validate_doc_vs_schema
        python_path: "did/validate.py"
        input_arguments:
          - name: docProps
            type_matlab: "struct"
            type_python: "dict"
          - name: schemaStruct
            type_matlab: "struct"
            type_python: "dict"
          - name: all_ids
            type_matlab: "cell"
            type_python: "list[str]"
        decision_log: >
          Python: did/validate.py:validate_doc_vs_schema. Validates classname,
          superclasses (recursing into each superclass schema), depends_on,
          file, and each class-specific property list against one schema.
          Carries MATLAB PR #153's semantics: only depends_on entries marked
          mustbenotempty are required to be present, and a missing optional
          dependency raises MissingOptionalDependencyWarning only when
          DID_FORCE_VALIDATION_WARNINGS is set to a non-zero value. MATLAB
          forces that warning past a caller's global warning('off') by
          switching the identifier on for the duration; Python's equivalent
          is a catch_warnings block with an 'always' filter. Failures raise
          ValidationError carrying MATLAB's error identifier (e.g.
          'DID:Database:ValidationDependsOn') as .identifier. Ported
          2026-08-28.

      - name: validate_field_type_and_value
        python_name: validate_field_type_and_value
        python_path: "did/validate.py"
        decision_log: >
          Python: did/validate.py:validate_field_type_and_value. Covers all
          MATLAB types: integer, double, matrix, timestamp, char/string,
          did_uid, structure, cell, and the unknown-type error. Deviation:
          MATLAB parses timestamps via java.time.LocalDateTime, Python via
          datetime.fromisoformat with strptime fallbacks -- both accept the
          schema's ISO-8601 timestamps with an optional trailing Z. Ported
          2026-08-28.

      - name: checkfiles
        kind: static
        python_name: check_files
        python_path: "did/validate.py"
        decision_log: >
          Ported 2026-08-28. Previously these three static methods shared a
          single "checkfiles / isfilenamematch / canfindonefile" entry, which
          meant a coverage check could not tell that isfilenamematch and
          canfindonefile were bridged at all. Split 2026-08-28.

      - name: isfilenamematch
        kind: static
        python_name: is_filename_match
        python_path: "did/validate.py"
        decision_log: >
          Exact match. Both treat a trailing '#' in the expected name as a
          numeric wildcard. Ported 2026-08-28.

      - name: canfindonefile
        kind: static
        python_name: can_find_one_file
        python_path: "did/validate.py"
        decision_log: >
          Deviation: MATLAB issues an HTTP HEAD request to pre-check a URL
          location; Python has no URL download path (see the sqlitedb entry),
          so a URL counts as findable and is resolved when actually read --
          which is also MATLAB's behavior for any non-file, non-http
          location. Ported 2026-08-28.

      - name: findfilematch
        kind: static
        python_name: ~   # not ported
        decision_log: >
          MATLAB helper used only by checkfiles: it returns the index of the
          actual file name matching an expected name. Python's check_files
          does the same matching inline through is_filename_match rather than
          returning an index, so there is no separate counterpart. Behavior is
          equivalent; no port planned. Added to the bridge 2026-08-28 -- it had
          no entry at all, so this was previously untracked.

      - name: get_preference_names
        python_name: ~   # not ported
        decision_log: >
          Public MATLAB API with no Python counterpart. Python's Database has
          the `preferences` dict but no accessors for it, so preferences can
          only be manipulated by reaching into the attribute directly. Added
          to the bridge 2026-08-28 -- previously untracked. See "Not Yet
          Ported" in PORTING_INSTRUCTIONS.md.

      - name: get_preference
        python_name: ~   # not ported
        decision_log: >
          Public MATLAB API with no Python counterpart. See
          get_preference_names. Added to the bridge 2026-08-28.

      - name: set_preference
        python_name: ~   # not ported
        decision_log: >
          Public MATLAB API with no Python counterpart. MATLAB validates the
          preference name and value type on write; Python has nothing
          equivalent. Added to the bridge 2026-08-28.

      - name: add_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to add_docs. Python
          exposes only the plural form. Deliberately not ported; recorded here
          so the coverage check does not report it as an unbridged public
          method. Added to the bridge 2026-08-28.

      - name: get_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to get_docs. See
          add_doc. Added to the bridge 2026-08-28.

      - name: remove_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to remove_docs. See
          add_doc. Added to the bridge 2026-08-28.

      - name: get_parent_branch
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden alias for get_branch_parent. Python exposes only
          get_branch_parent. Added to the bridge 2026-08-28.

      - name: display_branch
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden alias for display_branches, which is itself not ported.
          Added to the bridge 2026-08-28.

    decision_log: >
      Python Database class closely mirrors MATLAB did.database.
      Schema validation (validate_docs, get_document_schema,
      validate_doc_vs_schema, validate_field_type_and_value, checkfiles and
      friends) was ported 2026-08-28 and brought the entry up to MATLAB
      0142532, PR #153 included. A few MATLAB methods (freeze_branch,
      is_branch_editable, display_branches, exist_doc, close_doc) are still
      not ported. Deviation: MATLAB's add_docs also disables SQLite
      journalling when validation is off; Python does not, since its sqlite3
      connection is managed differently (see the sqlitedb open_db/close_db
      note). Synchronized 2026-03-15; validation 2026-08-28.

  # -----------------------------------------------------------------------
  # did.document
  # -----------------------------------------------------------------------
  - name: document
    type: class
    matlab_path: "+did/document.m"
    matlab_last_sync_hash: "13463d1"
    python_path: "did/document.py"
    python_class: "Document"

    properties:
      - name: document_properties
        python_name: document_properties
        type_matlab: "struct"
        type_python: "dict"
        decision_log: "Exact match. Synchronized 2026-03-16."

    methods:
      - name: document
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: document_type
            type_matlab: "char"
            type_python: "str"
            default: "'base'"
        decision_log: >
          MATLAB: document(document_type, options...).
          Python: Document(document_type, **kwargs).
          Python also supports dot-notation kwargs for nested properties.
          Synchronized 2026-03-16.

      - name: id
        python_name: id
        input_arguments: []
        output_arguments:
          - name: uid
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: setproperties
        python_name: set_properties
        input_arguments:
          - name: kwargs
            type_matlab: "name-value pairs"
            type_python: "**kwargs"
        decision_log: >
          MATLAB: setproperties(Name, Value, ...).
          Python: set_properties(**kwargs). Snake-case rename.
          Synchronized 2026-03-16.

      - name: dependency_value
        python_name: dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: value
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: set_dependency_value
        python_name: set_dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: value
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: dependency_value_n
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB for numbered dependency lists.
          Not yet ported to Python.

      - name: add_dependency_value_n
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB. Not yet ported to Python.

      - name: remove_dependency_value_n
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB. Not yet ported to Python.

      - name: add_file
        python_name: add_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: location
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB has options: ingest, delete_original, location_type.
          Python signature: add_file(filename, location).
          Synchronized 2026-03-16.

      - name: remove_file
        python_name: remove_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: is_in_file_list
        python_name: is_in_file_list
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: result
            type_python: "tuple(bool, dict, int)"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: validate
        python_name: ~   # not ported
        input_arguments:
          - name: did_database
            type_matlab: "did.database"
            type_python: "(deliberately not ported)"
        decision_log: >
          DO NOT PORT. Verified 2026-08-28: MATLAB's did.document.validate is
          dead code. It calls did.validate(), and there is no validate.m
          anywhere in DID-matlab -- so calling it raises (with nargin==1,
          "You must pass in an instance of did.database"; with a database
          argument, an undefined-function error). Its only callers are the
          retired tests under tests/+did/+test/_old/. This entry previously
          read "Not yet ported", which implied a real capability worth
          mirroring. Document validation in both languages goes through
          database.add_docs -> validate_docs; see the database entry.

      - name: plus
        python_name: ~   # not ported
        decision_log: >
          MATLAB operator overload for merging documents.
          Not ported to Python (use set_properties instead).

      - name: eq
        python_name: ~   # not ported
        decision_log: >
          MATLAB operator overload for comparing document IDs.
          Not ported to Python (use doc.id() == other.id()).

      - name: readblankdefinition
        python_name: read_blank_definition
        kind: static
        decision_log: >
          MATLAB: document.readblankdefinition(jsonfilelocationstring).
          Python: Document.read_blank_definition(json_file_location_string).
          Rewritten 2026-08-28 to match MATLAB. It previously read
          database_schema/<class>.schema.json -- the *validation schema* --
          as though it were the class definition, which meant a new document
          carried the schema's field-descriptor list as its property list,
          superclasses as bare name strings, and no document_class.validation
          at all. It now reads the definition
          (database_documents/<class>.json) and merges each superclass
          definition recursively, as MATLAB does: superclass lists unioned by
          definition string, depends_on unioned by name, and every other
          property list merged in without overwriting the subclass. A demoB
          document therefore carries the base, demoA and demoB property lists,
          and every document carries the validation pointer add_docs needs.
          The old schema-file path is retained as a fallback for callers that
          ship only a schema.

      - name: readjsonfilelocation
        python_name: read_json_file_location
        kind: static
        decision_log: >
          MATLAB: document.readjsonfilelocation. Python:
          Document.read_json_file_location, resolving via
          did/validate.py:resolve_definition_path. Handles a full path, a
          $PATH-relative reference, and a bare class name searched under the
          definition directories. Deviation: MATLAB also accepts a URL and
          webreads it; Python has no URL download path (see the sqlitedb
          entry), so that case is unsupported. Ported 2026-08-28.

      - name: reset_file_info
        python_name: _reset_file_info
        decision_log: >
          MATLAB: document.reset_file_info. Python:
          Document._reset_file_info. Both clear files.file_info for a newly
          created document whenever a files field exists. Fixed 2026-08-28:
          Python previously only set file_info when it was *absent*, so the
          template file_info entries that a definition may ship (demoFile.json
          ships two) survived into every new document. That was invisible
          while read_blank_definition was reading the schema file, which has
          no files field. MATLAB's emptystruct('name','locations') is an empty
          struct *array*, so the Python equivalent is [].

    decision_log: >
      Core functionality is synchronized. Document construction was brought
      in line with MATLAB on 2026-08-28 (see readblankdefinition,
      readjsonfilelocation and reset_file_info above), which is what makes
      schema validation possible -- documents now carry
      document_class.validation and their inherited property lists. MATLAB
      still has numbered dependency methods (dependency_value_n, etc.) that
      are not ported. MATLAB's validate method is dead code and is
      deliberately not ported. Synchronized 2026-03-16; construction and
      validation 2026-08-28.

