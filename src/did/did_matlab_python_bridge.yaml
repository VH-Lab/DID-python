# =========================================================================
# Not applicable in Python
# =========================================================================
not_applicable:
  - name: Contents
    rationale: >
      src/did/Contents.m is a MATLAB toolbox contents/version listing that
      `ver` reads -- a manifest, not code, and Python packaging carries the
      same information in pyproject.toml. Recorded 2026-08-28 so the coverage
      check can tell "deliberately out of scope" from "nobody has looked at
      this yet".


  - name: did.filesep
    rationale: >
      MATLAB-only utility. Python uses os.sep / pathlib natively.

  - name: Contents.m
    rationale: >
      MATLAB toolbox contents/version listing (a comment-only .m file read
      by MATLAB's `ver`/`help`). Not code, and Python carries its version in
      pyproject.toml. Recorded 2026-08-28 so the bridge-coverage audit has
      no unexplained MATLAB files.

  - name: did.toolboxdir
    rationale: >
      MATLAB-only utility for locating the DID toolbox directory.
      Python uses importlib.resources or __file__.
