  # did.ido
  # -----------------------------------------------------------------------
  - name: ido
    type: class
    matlab_path: "+did/ido.m"
    matlab_last_sync_hash: "3aa892d"
    python_path: "did/ido.py"
    python_class: "IDO"

    properties:
      - name: identifier
        python_name: identifier
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

    methods:
      - name: ido
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: id_value
            type_matlab: "char (optional)"
            type_python: "str (optional)"
        decision_log: >
          MATLAB: ido(id_value) stores the given id. Python: IDO(id_value)
          now does the same -- it previously regenerated an id that failed
          is_valid, silently discarding a caller's id. Ported 2026-08-28.

      - name: id
        python_name: id
        input_arguments: []
        output_arguments:
          - name: identifier
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: unique_id
        python_name: unique_id
        kind: static
        decision_log: >
          Both now produce num2hex(serial_date_number) + '_' + num2hex(rand):
          16 lowercase hex digits, an underscore, and 16 more. Python
          previously returned a UUID4 -- see the class decision_log below.
          Deviation: MATLAB derives the serial date number from clock (local
          time), Python from UTC, as did.ido's own documentation specifies.
          IDs are only ever compared for equality across the two languages,
          never parsed back into a time, and UTC keeps them sortable across
          machines in different time zones. Ported 2026-08-28.

      - name: isvalid
        python_name: is_valid
        kind: static
        input_arguments:
          - name: id_value
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: b
            type_python: "bool"
        decision_log: >
          MATLAB: ido.isvalid(id). Python: IDO.is_valid(id). Snake-case
          rename. Both now enforce the same rule: 16 hex digits (0-9a-f), an
          underscore, and 16 more, 33 characters in total. Python previously
          matched a UUID4 pattern. Ported 2026-08-28.

    decision_log: >
      IN SYNC as of 2026-08-28. This entry previously recorded the ID format
      difference (MATLAB 33-char hex vs Python UUID4) as acceptable because
      "both guarantee uniqueness". That was wrong, and adding schema
      validation to Python exposed it immediately: base.schema.json types
      base.id as did_uid, which requires exactly the MATLAB format, so every
      Python-generated document was schema-invalid and would be rejected by
      MATLAB's add_docs (which validates by default). UUID4 is also not
      sortable by creation time, which did.ido guarantees. Python now
      generates the MATLAB format.

