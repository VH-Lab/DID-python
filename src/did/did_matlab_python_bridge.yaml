    type: class
    matlab_path: "+did/query.m"
    matlab_last_sync_hash: "3aa892d"
    python_path: "did/query.py"
    python_class: "Query"

    properties:
      - name: searchstructure
        python_name: search_structure
        type_matlab: "struct array"
        type_python: "(internal)"
        decision_log: >
          MATLAB exposes searchstructure as a public property.
          Python stores it internally; access via to_search_structure().
          Synchronized 2026-03-15.

    methods:
      - name: query
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: field
            type_matlab: "char"
            type_python: "str"
          - name: op
            type_matlab: "char"
            type_python: "str"
          - name: param1
            type_matlab: "any"
            type_python: "any"
          - name: param2
            type_matlab: "any"
            type_python: "any"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: and
        python_name: __and__
        decision_log: >
          MATLAB: A & B. Python: A & B (via __and__).
          Exact match. Synchronized 2026-03-15.

      - name: or
        python_name: __or__
        decision_log: >
          MATLAB: A | B. Python: A | B (via __or__).
          Exact match. Synchronized 2026-03-15.

      - name: to_searchstructure
        python_name: to_search_structure
        decision_log: >
          MATLAB: to_searchstructure(). Python: to_search_structure().
          Snake-case rename. Synchronized 2026-03-15.

      - name: searchcellarray2searchstructure
        kind: static
        python_name: search_cell_array_to_search_structure
        decision_log: >
          CLOSED 2026-08-30 (DID-python#53). Python now branches on
          isinstance(value, str), the direct equivalent of MATLAB's ischar:
          a string gets 'regexp', everything else gets 'exact_number'.

          Correcting the 2026-08-28 note, which described the deviation more
          broadly than it was. Verified by running both branches over six
          value types:

          - str: regexp in both. Agreed.
          - int, float: exact_number in both. Agreed.
          - logical/bool: exact_number in both -- but only by accident, since
            bool subclasses int in Python and so satisfied the old
            isinstance(value, (int, float)) test. Now it agrees by rule.
          - cell/list, struct/dict: exact_number in MATLAB, 'regexp' in the
            old Python. This was the whole of the real divergence, and it was
            silent: a different operator, not an error.

          So it was never "handles only numbers and strings"; strings and
          numbers always agreed. Coverage:
          tests/test_ported_database_methods.py pins all six, including the
          logical case, so a future rewrite of the branch cannot regress it by
          accident.

      - name: searchstruct
        kind: static
        python_name: _create_search_structure
        decision_log: >
          Added to the bridge 2026-08-28 -- ported but previously untracked.
          Both assemble one {field, operation, param1, param2} entry. MATLAB
          exposes it as a public static method and validates the operation
          against the permitted set with mustBeMember; in Python it is a
          private instance helper, and the equivalent validation happens in
          Query.__init__ against VALID_OPS.

    decision_log: >
      Query operations are fully synchronized. All MATLAB query
      operations (regexp, exact_string, depends_on, isa, etc.)
      are supported in Python. Synchronized 2026-03-15.

