# did_matlab_python_bridge.yaml — Core DID classes
# The primary contract for the did namespace (core classes).
#
# Every public class / function in DID-MATLAB that has a Python counterpart
# is listed here together with:
#   - matlab_path            : location inside the MATLAB repo (relative to src/did/)
#   - matlab_last_sync_hash  : short SHA of the MATLAB commit last ported to Python
#   - python_path            : location inside the Python repo (relative to src/did/)
#   - python_class           : Python class name
#   - decision_log           : notes on deviations, sync dates, and rationale
#
# To check for drift, run:
#   git -C <DID-matlab> log <matlab_last_sync_hash>..HEAD -- <matlab_path>
# Any output means MATLAB has changed since the last port.

project_metadata:
  bridge_version: "1.0"
  matlab_repo: "VH-Lab/DID-matlab"
  python_repo: "VH-Lab/DID-python"
  naming_policy: "Strict MATLAB Mirror — Python names use snake_case equivalents"
  indexing_policy: "Semantic Parity (MATLAB 1-based, Python 0-based)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # -----------------------------------------------------------------------
  # did.database  (abstract base class)
  # -----------------------------------------------------------------------
  - name: database
    type: class
    matlab_path: "+did/database.m"
    matlab_last_sync_hash: "b2fe427"
    python_path: "did/database.py"
    python_class: "Database"
    inherits: "abc.ABC"
    out_of_sync: false
    sync_notes: >
      Schema validation was ported on 2026-08-28, closing what had been the
      largest capability gap between the two languages. Python previously had
      no document-vs-schema validation at all, so MATLAB PR #153
      (c561c13..0142532) had nothing to port into. The validator now lives in
      did/validate.py and is driven from Database.add_docs, which validates by
      default exactly as MATLAB's does, including PR #153's semantics: a
      schema-declared depends_on entry is required to be present only when the
      schema marks it mustbenotempty, optional ones may be omitted, and a
      missing optional dependency raises the opt-in
      MissingOptionalDependencyWarning gated on the
      DID_FORCE_VALIDATION_WARNINGS environment variable.

      Reviewed 2026-08-29 through MATLAB c0a9507, nothing to port. Two
      MATLAB fixes landed in this window and Python has neither defect:

      c0a9507 -- MATLAB's checkfiles built the "Some required files are
      missing" message and then fell through to isvalid = 1, so add_docs
      committed the document anyway. Python's validate.check_files returns
      (False, message) on that branch and Database.add_docs raises on it;
      tests/test_validation.py covers it. Python's can_find_one_file already
      matches the post-#156 MATLAB rule (no network I/O during validation, a
      non-local location is admitted and reported at read time), which is why
      no http pre-check appears on either side.

      4ce3e1b -- MATLAB's remove_docs wrapped each do_remove_doc call in a
      bare try/catch with an empty handler, nullifying OnMissing='error'.
      Python's Database.remove_docs calls _do_remove_doc directly with no
      exception handling, and SQLiteDB._do_remove_doc honors OnMissing
      (ignore returns, warn prints, anything else raises). Already correct.

      add_docs gained an OnDuplicate parameter on 2026-08-29 (default
      'error', mirroring MATLAB's mustBeMember), validated in this class and
      passed through to _do_add_doc; see the sqlitedb entry in
      did_matlab_python_bridge_implementations.yaml for the full note.
      Document.base.datestamp also changed on the same date, from
      str(datetime.utcnow()) to ISO-8601 milliseconds with a 'Z' suffix,
      matching DID-matlab's UTCLeapSeconds output and base.schema.json's own
      declared default; the old space-separated, timezone-less form was read
      as LOCAL time by a JS consumer's new Date().

    properties:
      - name: connection
        python_name: connection
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: version
        python_name: version
        type_matlab: "any"
        type_python: "None"
        decision_log: "Placeholder in both. Synchronized 2026-03-15."

      - name: current_branch_id
        python_name: current_branch_id
        type_matlab: "string"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: frozen_branch_ids
        python_name: frozen_branch_ids
        type_matlab: "cell"
        type_python: "list"
        decision_log: >
          MATLAB uses cell array, Python uses list.
          Synchronized 2026-03-15.

      - name: dbid
        python_name: dbid
        type_matlab: "any (transient)"
        type_python: "None"
        decision_log: "Transient handle in both. Synchronized 2026-03-15."

      - name: debug
        python_name: debug
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: preferences
        python_name: preferences
        type_matlab: "(not present)"
        type_python: "dict"
        decision_log: >
          Python-only property for configuration. Not in MATLAB.

    methods:
      - name: database
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: connection
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: database(connection). Python: Database(connection, **kwargs).
          Synchronized 2026-03-15.

      - name: open
        python_name: open
        input_arguments: []
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: close
        python_name: close
        input_arguments: []
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: all_branch_ids
        python_name: all_branch_ids
        input_arguments: []
        output_arguments:
          - name: branch_ids
            type_matlab: "cell"
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: add_branch
        python_name: add_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
          - name: parent_branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          CLOSED 2026-08-30 (DID-python#51). add_branch now makes MATLAB's
          three checks: BRANCH_ID is a non-empty string, is not already taken,
          and PARENT_BRANCH_ID (when not empty) exists. Python raises
          ValueError where MATLAB raises DID:Database:InvalidBranch, this
          codebase's convention throughout.

          Correcting the 2026-08-28 note, which said the SQLite schema was a
          backstop "so the data stays correct". That held for two of the three
          checks and not the third, and the third was the damaging one --
          verified by running each case:

          - Duplicate branch_id: UNIQUE constraint. Refused, but as a bare
            sqlite3.IntegrityError. Data correct.
          - Missing parent: FOREIGN KEY. Same. Data correct.
          - Empty or non-string branch_id: NO backstop, and accepted.
            `add_branch("")` created a branch whose id is empty and made it
            current; since "" is also the sentinel for *no* current branch,
            the next add_branch read that parent, converted it to NULL, and
            silently produced a ROOT instead of a child -- a branch in the
            wrong place in the tree. `add_branch(42)` stored '42' by TEXT
            affinity but set current_branch_id to the integer, and SQLite
            never compares an integer equal to a text value, so the current
            branch named nothing and get_doc_ids on it returned [] rather
            than raising.

          The empty-parent case now matches too. MATLAB reads an empty
          PARENT_BRANCH_ID as "use the current branch" (isempty covers both []
          and ''); Python had distinguished them, taking an explicit "" as
          "no parent". Both now mean the current branch, so a root is made
          only when there is no current branch -- on a fresh database, or
          after set_branch("").

          That has a consequence worth recording, because it is a limitation
          inherited from MATLAB rather than a Python one. MATLAB's set_branch
          validates its argument and refuses '', so MATLAB has no way to clear
          the current branch, and therefore no way to create a second root
          branch once it is on one. Its own test helper add_branch_nodes hits
          this: it positions with set_branch and adds with no explicit parent,
          so the second and later roots of a multi-root forest silently become
          children of whatever was added last.

          Python can still express it, because its set_branch is an unvalidated
          stub that accepts "" -- see the set_branch entry, where that is now
          the remaining asymmetry. tests/helpers.py add_branch_nodes uses it to
          build the forests the branch tests need.

          Regression coverage: tests/test_branch_guards.py.

      - name: set_branch
        python_name: set_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          Synchronized 2026-03-15; NOT an exact match, corrected 2026-08-28.
          Deviation found 2026-08-28: Python's method body carries a
          "# Validation logic would go here" placeholder where MATLAB calls
          validate_branch_id. Python accepts a branch_id that does not exist and
          sets current_branch_id to it; the error surfaces later, at the next
          add_docs ("Branch '<id>' does not exist."). MATLAB fails fast at
          set_branch. Fail-deferred rather than fail-silent, but the two
          languages report the mistake at different points.

          CLOSED 2026-08-30 (DID-python#52). set_branch now validates through
          _validate_branch_id, so a non-existent or empty id is refused here
          rather than surfacing later at the next add_docs. ValueError, where
          MATLAB raises DID:Database:InvalidBranch.

          The consequence was the reason this was held back, and it is now
          settled rather than avoided: refusing '' means the current branch
          cannot be cleared, and since add_branch reads an empty parent as
          "the current branch", a root can only be created when there is no
          current branch -- a fresh database, or after delete_branch drops the
          last one. Neither language can add a second root to a database that
          already has one. That is MATLAB's constraint, inherited on purpose.

          The three Python callers that relied on the old stub to make a
          parentless branch were changed rather than grandfathered:
          tests/helpers.py add_branch_nodes now refuses a multi-root forest
          exactly as MATLAB's does (VH-Lab/DID-matlab#165), test_branch builds
          make_tree(1,...) matching MATLAB's BranchTest, and the two
          add_docs suites create their second branch BEFORE the document
          exists, so it does not inherit it -- a sibling serves the purpose a
          root was serving.

          Whether did.database should gain a way to make a root is still a
          live question, and it is now the same question in both languages
          rather than a divergence. It is recorded on VH-Lab/DID-matlab#165.

      - name: get_branch
        python_name: get_branch
        input_arguments: []
        output_arguments:
          - name: branch_id
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_branch_parent
        python_name: get_branch_parent
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: parent_id
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_sub_branches
        python_name: get_sub_branches
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: sub_branch_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: delete_branch
        python_name: delete_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          CLOSED 2026-08-30 (DID-python#51). All three guards are now here,
          and delete_branch no longer leaves the current branch dangling.
          Python raises ValueError where MATLAB raises an identified error;
          that is this codebase's convention throughout, not a gap.

          1. Branch must exist. This had been a SILENT NO-OP -- nothing raised
             and nothing changed, so a script deleting the wrong id got no
             signal, and unlike the other two there was no schema backstop.
             _validate_branch_id now mirrors MATLAB's validate_branch_id: a
             non-empty string that names an existing branch.
          2. Branch must not have sub-branches. Previously this surfaced only
             as the FOREIGN KEY failing -- a raw sqlite3.IntegrityError with
             no indication of the cause -- where MATLAB raises
             DID:Database:ParentBranch.
          3. Branch must not be frozen. Nothing was refused, because
             freeze_branch had no counterpart; it does now.

          Also ported: after deleting the current branch, current_branch_id
          falls back to the first of the branch ids read before the delete, or
          to none if that was the branch just deleted. Both languages read
          those ids with the same unordered
          `SELECT DISTINCT branch_id FROM branches`, so the fallback picks the
          same branch in both. Without this the next add_branch inherited a
          parent that no longer existed and failed on the FOREIGN KEY.

          One line of MATLAB's is deliberately not mirrored: it drops the
          branch from frozen_branch_ids after deleting, which its own frozen
          guard has already made unreachable.

          History: recorded 2026-08-28 as the most divergent of the four
          stubbed branch methods, from a
          "# Validation logic would go here" placeholder where MATLAB calls
          validate_branch_id. Regression coverage: tests/test_branch_guards.py.

      - name: freeze_branch
        python_name: freeze_branch
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str (branch_id=None)"
        decision_log: >
          PORTED 2026-08-30 (DID-python#51), as the third of delete_branch's
          guards: without it there was nothing to refuse. Same semantics and
          same scope in both languages -- frozen_branch_ids is an in-memory
          property that is never written to the database, and delete_branch is
          the only place it is enforced. So a freeze still does not survive a
          session and still cannot cross languages; one process freezing a
          branch has no effect on any other. That was the 2026-08-28 finding,
          and porting the method does not change it.

      - name: is_branch_editable
        python_name: is_branch_editable
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str (branch_id=None)"
        decision_log: >
          PORTED 2026-08-30 (DID-python#51). Both return true only when the
          branch is neither frozen nor a parent of another branch -- the two
          conditions delete_branch refuses on, made available to ask about
          beforehand, which is precisely what the 2026-08-28 note said was
          missing.

      - name: display_branches
        python_name: display_branches
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str (branch_id=None)"
        decision_log: >
          PORTED 2026-08-30 (DID-python#53). Same recursive walk and the same
          " - <id>" line with two spaces of indent per level, defaulting to
          the current branch and validating the id. MATLAB disp()s; Python
          print()s. Coverage: tests/test_ported_database_methods.py.
          Display/visualization helper.

      - name: all_doc_ids
        python_name: all_doc_ids
        input_arguments: []
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: get_doc_ids
        python_name: get_doc_ids
        deviation_note: >
          Carries the same "# Validation logic would go here" placeholder as
          the branch methods above; MATLAB validates the branch_id first.
          Noted 2026-08-28.
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: add_docs
        python_name: add_docs
        input_arguments:
          - name: document_objs
            type_matlab: "cell of did.document"
            type_python: "list[Document]"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
          - name: customFileHandler
            type_matlab: "function_handle (name-value)"
            type_python: "callable (custom_file_handler=None)"
        decision_log: >
          MATLAB has options: OnDuplicate, Validate, customFileHandler.
          Python accepts **kwargs. Synchronized 2026-03-15.

          customFileHandler ported 2026-08-30 (DID-python#42). Same contract
          as open_doc's: called as (destPath, sourcePath), it must produce a
          local file at destPath, and it is how a downstream package supplies
          retrieval for a location DID cannot open itself. DID downloads
          nothing, in either language. Only a location marked `ingest` is
          retrieved here, which for a remote one is rare -- ingest defaults to
          0 for 'url' and 'ndicloud'.

          DELIBERATE SPELLING DIFFERENCE: snake_case custom_file_handler,
          matching open_doc's parameter for the same contract, rather than
          MATLAB's customFileHandler. Named explicitly on add_docs (not left
          to **kwargs) so the signature documents it, and threaded through to
          _do_add_doc; see the do_add_doc entry in
          did_matlab_python_bridge_implementations.yaml.

      - name: get_docs
        python_name: get_docs
        input_arguments:
          - name: document_ids
            type_matlab: "cell | char"
            type_python: "list[str] | str"
          - name: OnMissing
            type_matlab: "char name-value"
            type_python: "str"
            default: "'error'"
        output_arguments:
          - name: documents
            type_python: "list[Document]"
        decision_log: >
          MATLAB returns cell array of did.document; Python returns list.
          OnMissing behavior is the same. Synchronized 2026-03-16.

      - name: remove_docs
        python_name: remove_docs
        input_arguments:
          - name: document_ids
            type_matlab: "cell | char"
            type_python: "list[str] | str"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: search
        python_name: search
        input_arguments:
          - name: query_obj
            type_matlab: "did.query"
            type_python: "Query"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: run_sql_query
        python_name: do_run_sql_query
        input_arguments:
          - name: query_str
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: run_sql_query(query_str, returnStruct).
          Python: do_run_sql_query(query_str, params).
          Renamed in Python to match abstract method convention.
          Synchronized 2026-03-15.

      - name: open_doc
        python_name: open_doc
        python_path: "did/implementations/sqlitedb.py"
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "str"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: file_obj
            type_python: "ReadOnlyFileobj"
        decision_log: >
          Present in MATLAB database.m. Python SQLiteDB.open_doc returns
          ReadOnlyFileobj. Synchronized 2026-03-15.

      - name: exist_doc
        python_name: exist_doc
        python_path: "did/implementations/sqlitedb.py"
        input_arguments:
          - name: document_id
            type_matlab: "char | did.document"
            type_python: "str | Document"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: tf
            type_matlab: "logical"
            type_python: "bool"
          - name: file_path
            type_matlab: "char ('' when absent)"
            type_python: "str | None (None when absent)"
        decision_log: >
          Ported 2026-08-30 (DID-python#42). It lives on SQLiteDB rather than
          the Python base class, exactly as open_doc does: the resolution is
          implementation-specific (it reads the `files` table), and SQLiteDB
          is the only implementation. MATLAB likewise puts the work in
          sqlitedb.check_exist_doc and keeps only the id-validation wrapper on
          database.m.

          MATLAB's two outputs [tf, file_path] come back as a tuple. Both
          languages accept an id string or a document object (MATLAB via
          validate_doc_id, Python via _document_id), report only the first
          matching file, and report tf=false rather than erroring for a
          document or filename the database does not have. An empty filename
          is an error in both -- MATLAB's DID:SQLITEDB:open, Python's
          ValueError, since it is a bad argument rather than a missing file.

          DELIBERATE: file_path is None, not "", when the file does not exist.
          MATLAB returns an empty char because that is its only empty string;
          None cannot be mistaken for a usable relative path the way "" can
          (os.path.join(dir, "") yields a directory). This matches the
          intended caller: NDI-python's session.database_existbinarydoc is
          already typed (doc_or_id: ndi_document | str, filename) ->
          tuple[bool, Path | None] and returns (False, None) when it has
          nothing. It hands back a pathlib.Path where this returns a str, and
          it returns a path even when the file is absent; DID follows MATLAB
          and reports no path for a file that is not there.

          DELIBERATE: Python resolves through the same helper open_doc uses
          (_locations_for_file / _first_local_file), so exist_doc is true
          exactly when open_doc would return a file with no
          custom_file_handler. MATLAB searches the same two candidate roots as
          do_open_doc -- filecachepath/<uid> and FileDir/<uid> -- and stops
          there, so Python additionally reports true for a local
          orig_location or cached_location that exists on disk and MATLAB has
          not yet ingested. That is a superset, and it is the answer the
          caller asked for: MATLAB's own do_open_doc would open such a file.

      - name: close_doc
        python_name: close_doc
        input_arguments:
          - name: file_obj
            type_matlab: "did.file.fileobj"
            type_python: "Fileobj"
        decision_log: >
          PORTED 2026-08-30 (DID-python#53). MATLAB's close_doc delegates to
          do_close_doc, whose default implementation is a single
          file_obj.fclose(); no implementation overrides it, so there is no
          separate _do_close_doc here and close_doc calls fclose directly. A
          None argument is tolerated and a second call is a no-op, since
          Fileobj.fclose already guards on fid.

          Python's file objects still close on garbage collection, so this was
          never a leak -- what was missing was the explicit call. Coverage:
          tests/test_ported_database_methods.py.

      - name: validate_docs
        python_name: validate_docs
        input_arguments:
          - name: document_objs
            type_matlab: "cell of did.document"
            type_python: "list[Document] | list[dict]"
        decision_log: >
          MATLAB: database.validate_docs(document_objs), called from add_docs
          when the Validate option is on. Python: Database.validate_docs(),
          called from add_docs when validate is True (the default in both).
          Both build all_ids as the superset of the document ids already in
          the database and those in the batch, so a batch may depend on
          itself; both check that each doc has a non-empty document_class
          with class_name / property_list_name / class_version, skip any doc
          whose document_class has no validation field, and otherwise load
          the schema and hand off to validate_doc_vs_schema. The per-document
          work lives in did/validate.py:validate_docs. Ported 2026-08-28.

          ACCESS, aligned 2026-08-30 (DID-matlab#163, 5c0e0f6). Python's has
          been public since DID-python#27; MATLAB's sat in a
          methods(Access=protected) block,
          a divergence this entry never recorded. The symmetry read gate
          (DID-python#28 / DID-matlab#155) has to validate documents the
          OTHER language wrote, which is by definition a call from outside
          the class, and it failed with MATLAB:class:MethodRestricted on its
          first run. MATLAB's is now public too; add_docs still calls it on
          the Validate path exactly as before, and protected -> public is
          additive.

      - name: get_document_schema
        python_name: get_document_schema
        python_path: "did/validate.py"
        input_arguments:
          - name: schema_filename
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: database.get_document_schema. Python:
          did/validate.py:get_document_schema, with the path resolution split
          out into resolve_definition_path. Both expand a $PATH placeholder
          against the definitions map and try the literal name, then
          '.schema.json', then '_schema.json'. Ported 2026-08-28.

      - name: validate_doc_vs_schema
        python_name: validate_doc_vs_schema
        python_path: "did/validate.py"
        input_arguments:
          - name: docProps
            type_matlab: "struct"
            type_python: "dict"
          - name: schemaStruct
            type_matlab: "struct"
            type_python: "dict"
          - name: all_ids
            type_matlab: "cell"
            type_python: "list[str]"
        decision_log: >
          Python: did/validate.py:validate_doc_vs_schema. Validates classname,
          superclasses (recursing into each superclass schema), depends_on,
          file, and each class-specific property list against one schema.
          Carries MATLAB PR #153's semantics: only depends_on entries marked
          mustbenotempty are required to be present, and a missing optional
          dependency raises MissingOptionalDependencyWarning only when
          DID_FORCE_VALIDATION_WARNINGS is set to a non-zero value. MATLAB
          forces that warning past a caller's global warning('off') by
          switching the identifier on for the duration; Python's equivalent
          is a catch_warnings block with an 'always' filter. Failures raise
          ValidationError carrying MATLAB's error identifier (e.g.
          'DID:Database:ValidationDependsOn') as .identifier. Ported
          2026-08-28.

          ENUMERATED DEPENDENCIES, fixed in BOTH repos 2026-08-30
          (DID-python#41). The depends_on value loop matched the schema's
          declared name against the document's RAW names while the presence
          check just above used the enumeration-stripped ones. A document
          holds 'syncrule_id_1' where the schema declares 'syncrule_id', so
          the two never matched: the value read back as empty, and both the
          mustbenotempty check and the dependent-id resolution check were
          skipped. An enumerated dependency could name a document that exists
          in no database and in no batch and still validate. Both languages
          now match on the stripped names and check EVERY entry sharing a
          stem, since an enumerated dependency may legitimately carry several
          (syncrule_id_1, syncrule_id_2) -- the assumption the old one-match
          lookup broke. The error message now names the document's own entry
          ('syncrule_id_2') rather than the schema's stem, so it says which
          of several is at fault.

          The MATLAB fix was authored in lockstep in +did/database.m and
          merged as DID-matlab#163 (b2fe427); this entry's
          matlab_last_sync_hash is bumped to it. The only commits touching
          database.m between the previous hash (c0a9507) and b2fe427 are that
          PR's two, d31c575 and 5c0e0f6, and both are carried here.

      - name: validate_field_type_and_value
        python_name: validate_field_type_and_value
        python_path: "did/validate.py"
        decision_log: >
          Python: did/validate.py:validate_field_type_and_value. Covers all
          MATLAB types: integer, double, matrix, timestamp, char/string,
          did_uid, structure, cell, and the unknown-type error. Deviation:
          MATLAB parses timestamps via java.time.LocalDateTime, Python via
          datetime.fromisoformat with strptime fallbacks -- both accept the
          schema's ISO-8601 timestamps with an optional trailing Z. Ported
          2026-08-28.

      - name: checkfiles
        kind: static
        python_name: check_files
        python_path: "did/validate.py"
        decision_log: >
          Ported 2026-08-28. Previously these three static methods shared a
          single "checkfiles / isfilenamematch / canfindonefile" entry, which
          meant a coverage check could not tell that isfilenamematch and
          canfindonefile were bridged at all. Split 2026-08-28.

      - name: isfilenamematch
        kind: static
        python_name: is_filename_match
        python_path: "did/validate.py"
        decision_log: >
          Exact match. Both treat a trailing '#' in the expected name as a
          numeric wildcard. Ported 2026-08-28.

      - name: canfindonefile
        kind: static
        python_name: can_find_one_file
        python_path: "did/validate.py"
        decision_log: >
          Exact match. A local path must exist; ANY non-local location -- an
          http(s) URL, an s3:// key, anything else -- is not pre-checked and
          counts as findable, its existence evaluated when the file is read.
          Validation does no network I/O in either language.

          Changed in BOTH repos on 2026-08-28, in lockstep. MATLAB previously
          singled out http(s) and tried to HEAD-check it, so a file the schema
          marked mustbenotempty and hosted at a URL was rejected at validation
          as "Missing file". Two things were wrong with that: the branch had
          never worked (it passed an unassigned `url` variable to req.send and
          swallowed the error in a bare catch, so it could never report found),
          and singling out http was inconsistent with every other non-local
          scheme, which was accepted without a check. Python had mirrored the
          resulting behavior.

          The pre-check was removed rather than repaired, per the project
          decision that a URL location should behave as a mustbenotempty == 0
          file does. Repairing it instead would have put a network round-trip
          inside validation and required a URL download path in Python to
          match. Coverage: tests/test_validation.py:TestRemoteFileLocations.

          Note the shipped demoFile.json template carries location_type "url"
          entries, so remote locations are a first-class part of the document
          format; rejecting them was never the intent.

      - name: findfilematch
        kind: static
        python_name: ~   # not ported
        decision_log: >
          MATLAB helper used only by checkfiles: it returns the index of the
          actual file name matching an expected name. Python's check_files
          does the same matching inline through is_filename_match rather than
          returning an index, so there is no separate counterpart. Behavior is
          equivalent; no port planned. Added to the bridge 2026-08-28 -- it had
          no entry at all, so this was previously untracked.

      - name: get_preference_names
        python_name: get_preference_names
        decision_log: >
          PORTED 2026-08-30 (DID-python#53). MATLAB returns a cell array of
          the keys; Python returns a list. Empty when nothing has been set.
          The `preferences` dict had been here all along with no accessors, so
          the only way to use it was to reach into the attribute.

      - name: get_preference
        python_name: get_preference
        decision_log: >
          PORTED 2026-08-30 (DID-python#53). Mirrors MATLAB's three-argument
          form: an unset preference raises when no default is given, and
          returns the default when one is.

          The default is *args rather than default=None deliberately. MATLAB's
          set_preference stores [] for a valueless call, so Python stores
          None, and a stored None has to stay distinguishable from "never
          set". A default=None signature would have collapsed the two and made
          an unset preference silently return None instead of raising.

      - name: set_preference
        python_name: set_preference
        decision_log: >
          PORTED 2026-08-30 (DID-python#53). An omitted value stores None,
          as MATLAB stores []. A non-string or empty name raises, as in MATLAB
          (DID:Database:MissingPrefName / InvalidPrefName; ValueError here).

          Superseded note:
          Public MATLAB API with no Python counterpart. MATLAB validates the
          preference name and value type on write; Python has nothing
          equivalent. Added to the bridge 2026-08-28.

      - name: add_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to add_docs. Python
          exposes only the plural form. Deliberately not ported; recorded here
          so the coverage check does not report it as an unbridged public
          method. Added to the bridge 2026-08-28.

      - name: get_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to get_docs. See
          add_doc. Added to the bridge 2026-08-28.

      - name: remove_doc
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden singular-form alias that forwards to remove_docs. See
          add_doc. Added to the bridge 2026-08-28.

      - name: get_parent_branch
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden alias for get_branch_parent. Python exposes only
          get_branch_parent. Added to the bridge 2026-08-28.

      - name: display_branch
        kind: hidden
        python_name: ~   # not ported
        decision_log: >
          MATLAB Hidden alias for display_branches, which is itself not ported.
          Added to the bridge 2026-08-28.

    decision_log: >
      Python Database class closely mirrors MATLAB did.database.
      Schema validation (validate_docs, get_document_schema,
      validate_doc_vs_schema, validate_field_type_and_value, checkfiles and
      friends) was ported 2026-08-28 and brought the entry up to MATLAB
      0142532, PR #153 included. exist_doc was ported 2026-08-30
      (DID-python#42), onto SQLiteDB as open_doc is; a few MATLAB methods
      (freeze_branch, is_branch_editable, display_branches, close_doc) are
      still not ported. Deviation: MATLAB's add_docs also disables SQLite
      journalling when validation is off; Python does not, since its sqlite3
      connection is managed differently (see the sqlitedb open_db/close_db
      note). Synchronized 2026-03-15; validation 2026-08-28.

  # -----------------------------------------------------------------------
  # did.document
  # -----------------------------------------------------------------------
  - name: document
    type: class
    matlab_path: "+did/document.m"
    matlab_last_sync_hash: "13463d1"
    python_path: "did/document.py"
    python_class: "Document"

    properties:
      - name: document_properties
        python_name: document_properties
        type_matlab: "struct"
        type_python: "dict"
        decision_log: "Exact match. Synchronized 2026-03-16."

    methods:
      - name: document
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: document_type
            type_matlab: "char"
            type_python: "str"
            default: "'base'"
        decision_log: >
          MATLAB: document(document_type, options...).
          Python: Document(document_type, **kwargs).
          Python also supports dot-notation kwargs for nested properties.
          Synchronized 2026-03-16.

      - name: id
        python_name: id
        input_arguments: []
        output_arguments:
          - name: uid
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: setproperties
        python_name: set_properties
        input_arguments:
          - name: kwargs
            type_matlab: "name-value pairs"
            type_python: "**kwargs"
        decision_log: >
          MATLAB: setproperties(Name, Value, ...).
          Python: set_properties(**kwargs). Snake-case rename.
          Synchronized 2026-03-16.

          Qualified 2026-08-28: the Python body describes itself as "a
          simplified way to set properties" and notes that a full
          implementation would differ. Not audited field-by-field against
          MATLAB's version; treat the parity claim as unverified rather than
          established.

      - name: dependency_value
        python_name: dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: value
            type_python: "str"
        decision_log: >
          Exact match. Synchronized 2026-03-16. Matching was made
          case-insensitive on 2026-08-28 to mirror MATLAB's strcmpi; it had
          been case-sensitive.

      - name: set_dependency_value
        python_name: set_dependency_value
        input_arguments:
          - name: dependency_name
            type_matlab: "char"
            type_python: "str"
          - name: value
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          Synchronized 2026-03-16, with two changes on 2026-08-28.

          Matching is now case-insensitive, mirroring MATLAB's strcmpi. It had
          been case-sensitive, so a MATLAB-written dependency named Item_1 was
          unreachable from Python by item_1.

          Deliberate divergence: Python refuses to append an entry named for
          the bare stem when the document already holds an enumerated list
          (item_1, item_2, ...), directing the caller to
          add_dependency_value_n instead. MATLAB appends without complaint,
          which is how the silent corruption described under
          dependency_value_n was produced. The guard fires only on the append
          path -- updating an existing entry, enumerated or not, is unchanged.

      - name: dependency_value_n
        python_name: dependency_value_n
        decision_log: >
          Ported 2026-08-28. Both walk name_1, name_2, ... and stop at the
          first missing suffix, so an entry above a gap is invisible to both.

          Ported because the gap was worse than the Low priority it carried.
          The severity was in the write half: with no add_dependency_value_n,
          the only way to append was set_dependency_value(stem, ...,
          error_if_not_found=False), which wrote an entry named for the bare
          stem. The schema declares un-enumerated stems and
          _strip_enumeration_suffix maps that name onto the same stem, so both
          validators accepted it, while MATLAB's reader stopped at the gap and
          never saw it -- silent cross-language data loss on an ordinary call.

      - name: add_dependency_value_n
        python_name: add_dependency_value_n
        decision_log: >
          Ported 2026-08-28. Both append name_(n+1), taking n from the
          contiguous count rather than the highest suffix present, so an append
          alongside a gap fills the gap exactly as MATLAB's numel(d)+1 does.
          Both raise on a document with no depends_on field unless
          ErrorIfNotFound/error_if_not_found is false.

      - name: remove_dependency_value_n
        python_name: remove_dependency_value_n
        decision_log: >
          Ported 2026-08-28. Both delete name_n and renumber the entries above
          it, which is what keeps the list gap-free -- a gap would truncate
          every later read. MATLAB's "Could not locate entry" check is
          unconditional, firing even when ErrorIfNotFound is false, and Python
          mirrors that. n is the suffix in name_n, so it stays 1-based in
          Python as in MATLAB: it names the entry rather than indexing a list,
          which is the one place the repo's 0-based indexing policy does not
          apply. MATLAB's unused `value` argument is kept for signature parity.

      - name: add_file
        python_name: add_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
          - name: location
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB has options: ingest, delete_original, location_type.
          Python signature: add_file(filename, location).
          Synchronized 2026-03-16.

      - name: remove_file
        python_name: remove_file
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: is_in_file_list
        python_name: is_in_file_list
        input_arguments:
          - name: name
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: result
            type_python: "tuple(bool, dict, int)"
        decision_log: "Exact match. Synchronized 2026-03-16."

      - name: validate
        python_name: ~   # not ported
        input_arguments:
          - name: did_database
            type_matlab: "did.database"
            type_python: "(deliberately not ported)"
        decision_log: >
          DO NOT PORT. Verified 2026-08-28: MATLAB's did.document.validate is
          dead code. It calls did.validate(), and there is no validate.m
          anywhere in DID-matlab -- so calling it raises (with nargin==1,
          "You must pass in an instance of did.database"; with a database
          argument, an undefined-function error). Its only callers are the
          retired tests under tests/+did/+test/_old/. This entry previously
          read "Not yet ported", which implied a real capability worth
          mirroring. Document validation in both languages goes through
          database.add_docs -> validate_docs; see the database entry.

      - name: plus
        python_name: ~   # not ported
        decision_log: >
          MATLAB operator overload for merging documents.
          Not ported to Python (use set_properties instead).

      - name: eq
        python_name: ~   # not ported
        do_not_port: true
        decision_log: >
          DO NOT PORT -- dead code in MATLAB, reclassified 2026-08-28. It was
          listed as "not yet ported", which invited someone to port a bug.
          MATLAB's eq compares
          document_properties.did_document.id, and no such field exists
          anywhere in either repo: documents carry base.id. Calling it on a
          real document raises "Reference to non-existent field". Same status
          as document.validate.

          Note for Python callers: with no __eq__, `doc_a == doc_b` falls back
          to identity, so two Document objects holding the same base.id compare
          unequal. If an id comparison is ever wanted, implement it against
          base.id rather than mirroring MATLAB here.

          Original note follows:
          MATLAB operator overload for comparing document IDs.
          Not ported to Python (use doc.id() == other.id()).

      - name: readblankdefinition
        python_name: read_blank_definition
        kind: static
        decision_log: >
          MATLAB: document.readblankdefinition(jsonfilelocationstring).
          Python: Document.read_blank_definition(json_file_location_string).
          Rewritten 2026-08-28 to match MATLAB. It previously read
          database_schema/<class>.schema.json -- the *validation schema* --
          as though it were the class definition, which meant a new document
          carried the schema's field-descriptor list as its property list,
          superclasses as bare name strings, and no document_class.validation
          at all. It now reads the definition
          (database_documents/<class>.json) and merges each superclass
          definition recursively, as MATLAB does: superclass lists unioned by
          definition string, depends_on unioned by name, and every other
          property list merged in without overwriting the subclass. A demoB
          document therefore carries the base, demoA and demoB property lists,
          and every document carries the validation pointer add_docs needs.
          The old schema-file path is retained as a fallback for callers that
          ship only a schema.

      - name: readjsonfilelocation
        python_name: read_json_file_location
        kind: static
        decision_log: >
          MATLAB: document.readjsonfilelocation. Python:
          Document.read_json_file_location, resolving via
          did/validate.py:resolve_definition_path. Handles a full path, a
          $PATH-relative reference, and a bare class name searched under the
          definition directories. Deviation: MATLAB also accepts a URL and
          webreads it; Python has no URL download path (see the sqlitedb
          entry), so that case is unsupported. Ported 2026-08-28.

      - name: reset_file_info
        python_name: _reset_file_info
        decision_log: >
          MATLAB: document.reset_file_info. Python:
          Document._reset_file_info. Both clear files.file_info for a newly
          created document whenever a files field exists. Fixed 2026-08-28:
          Python previously only set file_info when it was *absent*, so the
          template file_info entries that a definition may ship (demoFile.json
          ships two) survived into every new document. That was invisible
          while read_blank_definition was reading the schema file, which has
          no files field. MATLAB's emptystruct('name','locations') is an empty
          struct *array*, so the Python equivalent is [].

    decision_log: >
      Core functionality is synchronized. Document construction was brought
      in line with MATLAB on 2026-08-28 (see readblankdefinition,
      readjsonfilelocation and reset_file_info above), which is what makes
      schema validation possible -- documents now carry
      document_class.validation and their inherited property lists. MATLAB
      still has numbered dependency methods (dependency_value_n, etc.) that
      are not ported. MATLAB's validate method is dead code and is
      deliberately not ported. Synchronized 2026-03-16; construction and
      validation 2026-08-28.

