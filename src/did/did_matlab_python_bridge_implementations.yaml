# did_matlab_python_bridge_implementations.yaml — Database implementations
# Contract for did.implementations namespace.
#
# To check for drift, run:
#   git -C <DID-matlab> log <matlab_last_sync_hash>..HEAD -- <matlab_path>

project_metadata:
  bridge_version: "1.0"
  matlab_repo: "VH-Lab/DID-matlab"
  python_repo: "VH-Lab/DID-python"
  naming_policy: "Strict MATLAB Mirror — Python names use snake_case equivalents"
  indexing_policy: "Semantic Parity (MATLAB 1-based, Python 0-based)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # -----------------------------------------------------------------------
  # did.implementations.sqlitedb
  # -----------------------------------------------------------------------
  - name: sqlitedb
    type: class
    matlab_path: "+did/+implementations/sqlitedb.m"
    matlab_last_sync_hash: "a0bb373"
    python_path: "did/implementations/sqlitedb.py"
    python_class: "SQLiteDB"
    inherits_matlab: "did.database"
    inherits_python: "Database"
    out_of_sync: false
    sync_notes: >
      MATLAB 14439fb (2026-06-12, audit 6.1-3) added a private
      escapeSqlLiteral() helper and applied it at the 14 sites where
      sqlitedb.m interpolates branch_id / doc_id / document_id / filename
      into double-quoted SQL literals. That commit was explicitly authored
      in lockstep with the DID-python side of the same audit item, which is
      already present here: SQLiteDB binds every branch/doc/file identifier
      as a "?" parameter (sqlite3 handles the escaping), and the one place
      that must build SQL text -- the search-condition builder, where the
      operator and field vary -- routes its values through _sql_escape()
      and validates field names. Verified 2026-08-28: no unparameterized
      identifier interpolation remains (the only f-string SQL builds a
      list of "?" placeholders). Behaviorally in sync; no port needed.

      MATLAB 926c430 (2026-03-30) replaced websave() with
      ndi.cloud.api.files.getFile() for URL file downloads. Python has no
      URL download path at all -- SQLiteDB.open_doc() resolves only local
      (absolute or db-relative) locations -- so there is nothing to port;
      see the not_applicable entry for ndi.cloud.api.files.getFile and the
      "Not Yet Ported" table in PORTING_INSTRUCTIONS.md.

      MATLAB 6edd765 (2026-07-22) fixed two lifecycle defects on the add
      path. Reviewed 2026-08-29; neither is present here, but the first
      leaves a behavioral divergence worth recording:

      (a) MATLAB's do_add_doc honored OnDuplicate='ignore'/'warn' by not
      erroring, then reached the branch_docs INSERT anyway and threw on
      PRIMARY KEY(branch_id,doc_idx). Python never had that failure --
      SQLiteDB._do_add_doc caught sqlite3.IntegrityError around that INSERT
      -- but it had no OnDuplicate option at all and so always behaved as
      'ignore', silently keeping stale content where MATLAB errors.
      CLOSED 2026-08-29 by porting audriB's e72551f from DID-python#26:
      add_docs and _do_add_doc now take OnDuplicate in
      {error(default),warn,ignore}, validated up front against
      _ON_DUPLICATE_CHOICES the way MATLAB's mustBeMember does, and the
      duplicate path returns early without rewriting content. The default
      is now 'error', matching MATLAB -- a behavior change: re-adding a
      document already on a branch raises where it used to be a silent
      no-op. No existing test or caller relied on the old behavior.

      That commit also made the add path atomic, which MATLAB reached by a
      different route. Python inserted docs/doc_data rows BEFORE the
      branch_docs FOREIGN KEY check discovered a missing branch, and raised
      without rolling back, so the orphan rows sat in the open transaction
      and were committed by the next successful add -- a document belonging
      to no branch was then reported present. The branch is now checked
      before any INSERT, and every failure path rolls back and restores the
      _fields_cache snapshot. Regression: tests/test_add_docs_atomicity.py.

      (b) MATLAB's add_docs('Validate',false) issued `pragma
      journal_mode=OFF` and restored it only on the normal exit path, so a
      throw in the document loop disabled rollback protection for the life
      of the connection; 6edd765 restores it from an onCleanup. Python has
      no such fast path -- it never changes journal_mode (grep confirms no
      occurrence in did/) -- so there is nothing to restore.

      MATLAB edb1a6b (2026-08-30) closed issue #55: a document removed from
      its last branch is now removed completely. Reviewed 2026-08-30; no code
      moved. The part that matters most was already here -- _do_remove_doc has
      deleted the doc_data, files and docs rows since DID-python#39, in the
      order MATLAB has now adopted -- so on the reclamation itself the two
      languages agree exactly. Two MATLAB-only additions came with that commit
      and are recorded as divergences on the do_remove_doc and do_add_doc
      entries: deleting the ingested copies from disk, and retiring removed
      document ids in a new deleted_docs table.

      MATLAB a0bb373 (2026-08-30) finished issue #55 by applying that same
      reclamation to the other path that orphans a document: deleting a
      branch. Reviewed 2026-08-30; Python's _do_delete_branch does not
      reclaim, so this is a third divergence, recorded on a new
      do_delete_branch entry below.

    properties:
      - name: FileDir
        python_name: ~   # not ported
        type_matlab: "char"
        type_python: "(derived from connection path)"
        decision_log: >
          MATLAB stores FileDir explicitly. Python derives file storage
          paths from the database connection string. Synchronized 2026-03-15.

      - name: fields_cache
        python_name: _fields_cache
        type_matlab: "cell (protected)"
        type_python: "dict (private)"
        decision_log: >
          Both cache field name-to-index mappings for performance.
          Synchronized 2026-03-15.

    methods:
      - name: sqlitedb
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: filename
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: sqlitedb(filename). Python: SQLiteDB(filename).
          Both create/open a SQLite database file.
          Synchronized 2026-03-15.

      - name: do_run_sql_query
        python_name: do_run_sql_query
        input_arguments:
          - name: query_str
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: do_run_sql_query(query_str, varargin).
          Python: do_run_sql_query(query_str, params=()).
          Python uses parameterized queries. Synchronized 2026-03-15.

      - name: do_add_doc
        python_name: _do_add_doc
        out_of_sync: true
        out_of_sync_reason: >
          Ingestion is fully in sync as of DID-python#45 (see sync_notes). What
          reopened this entry is unrelated to ingestion: MATLAB edb1a6b (issue
          #55) refuses a document whose id was previously removed from every
          branch, raising DID:SQLITEDB:DELETED_DOC after consulting the
          deleted_docs table. Python has neither the table nor the check, so
          re-adding a removed id still succeeds here. See the do_remove_doc
          entry, which is where that id is retired.
        sync_notes: >
          CLOSED 2026-08-30 (DID-python#45). Python's _do_add_doc now mirrors
          MATLAB's ingestion loop in full. Three separate gaps were closed in
          sequence, recorded here because the entry was out_of_sync for each:

          - The `files` table was never populated. Before that fix a
            Python-written database was unreadable from MATLAB, whose
            do_open_doc resolves a file purely through the docs/files join.
          - Remote ingestion (DID-python#42): a location marked `ingest` whose
            location is not a local path is retrieved through
            custom_file_handler into FileDir/<uid>.
          - Local ingestion (DID-python#45): a location marked `ingest` whose
            location IS local is copied into FileDir/<uid>, and on success
            delete_original deletes the source, as MATLAB does. Deletion never
            applies to a remote location -- MATLAB guards it with a '://'
            check, since a remote location is not ours to remove.
        input_arguments:
          - name: document_obj
            type_matlab: "did.document"
            type_python: "Document"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
          - name: customFileHandler
            type_matlab: "function_handle (name-value)"
            type_python: "callable (custom_file_handler=None)"
        decision_log: >
          Both insert document JSON and populate field tables via doc2sql.
          Synchronized 2026-03-15.

          customFileHandler ported 2026-08-30 (DID-python#42), threaded
          add_docs -> _do_add_doc -> _populate_files -> _ingest_location.
          Local ingestion landed in the same helper on 2026-08-30
          (DID-python#45): _ingest_location copies a local location marked
          `ingest` with shutil.copyfile where MATLAB uses copyfile(...,'f'),
          then honors delete_original.
          Spelled custom_file_handler, matching open_doc; see the add_docs
          entry in did_matlab_python_bridge.yaml.

          Failure behaviour follows MATLAB's: a retrieval that fails -- the
          handler raises, produces no file, or was never supplied -- WARNS and
          stores an empty cached_location rather than raising. The document is
          still added and orig_location is still recorded, so open_doc can
          retrieve the file later with a handler; failing the add would lose
          the document over a file MATLAB is willing to add without. Python
          warns through warnings.warn where MATLAB uses
          warning('DID:SQLiteDB:add_doc',...), and the missing-handler text
          carries the same explanation open_doc's error does.

          Two Python additions, both guarding against losing a file MATLAB
          would also lose:

          - An existing file at FileDir/<uid> is removed before the handler
            runs, as open_doc does for its download. Without that, a handler
            that produced nothing would be indistinguishable from one that
            succeeded and a stale file would be recorded as this document's
            ingested copy.
          - A local location that already IS FileDir/<uid> is left alone
            rather than copied onto itself. Re-adding a document whose
            location was rewritten to its ingested path reaches this, and
            honoring delete_original there would delete the only copy. MATLAB
            would warn on the failed copyfile and skip the delete; Python
            keeps the copy and records it.

          Python resolves a relative local location against the database
          directory before copying (the same rebasing open_doc does), so a
          document written with a relative path is not ingested from the
          process's working directory.

      - name: do_get_doc
        python_name: _do_get_doc
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: document
            type_python: "Document"
        decision_log: >
          Both retrieve document JSON from docs table and reconstruct
          did.document / Document object. Synchronized 2026-03-15.

      - name: do_remove_doc
        python_name: _do_remove_doc
        out_of_sync: true
        out_of_sync_reason: >
          The reclamation itself is in sync (see decision_log). What remains is
          two things MATLAB edb1a6b added on top of it, neither of which exists
          here:

          - Cached files are not deleted from disk. When the last branch
            reference goes, MATLAB reads files.cached_location for the document
            and deletes each ingested copy before dropping the rows. Python
            drops the rows and leaves the copies behind. Since DID-python#45
            closed local ingestion this applies to ordinary documents, not just
            remote ones: any location marked `ingest` is now copied to
            FileDir/<uid> here too, and the two languages share one cache
            directory (MATLAB d7ac853). A removal from Python therefore leaves
            a file behind that the same removal from MATLAB deletes, in a
            directory both of them read.
          - Removed document ids are not retired. MATLAB records the id in a
            new deleted_docs table and refuses it on the way back in; Python
            has neither the table nor the check, so a removed id can be added
            again. See the do_add_doc entry.

          Neither breaks reading across languages. deleted_docs is created on
          demand and is not one of MATLAB's mandatory tables, so a
          Python-written database opens in MATLAB unchanged, and MATLAB does
          not write the table into one merely by reading it.
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "str"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          The table reclamation now matches exactly. Recorded 2026-08-30,
          superseding the 2026-08-29 note that MATLAB left the docs and
          doc_data rows in place behind a commented-out TODO. MATLAB edb1a6b
          implements that TODO: when the last branch reference goes it deletes
          the doc_data, files and docs rows -- the same three deletes, in the
          same order, that _do_remove_doc runs, under the same guard (no
          surviving branch_docs row for the document).

          That order is what the two languages converged on, not where either
          started. doc_data and files both carry
          FOREIGN KEY(doc_idx) REFERENCES docs(doc_idx), so the docs row has to
          go last. Python enforces it (PRAGMA foreign_keys = ON), which is why
          the bug surfaced here first -- a document with an attached file
          simply refused to be removed, fixed in DID-python#39. MATLAB sets no
          such pragma, so both of its earlier drafts had the order wrong
          harmlessly: main's commented sketch dropped docs while files rows
          still pointed at it, and the stranded `sql` branch dropped docs
          before doc_data. edb1a6b corrects the order anyway, so turning the
          pragma on there stays a one-line change rather than a bug hunt.

      - name: do_delete_branch
        python_name: _do_delete_branch
        out_of_sync: true
        out_of_sync_reason: >
          Recorded 2026-08-30. Deleting a branch is the second way a document
          comes to be referenced by no branch at all, and MATLAB a0bb373
          (issue #55) now gives it the same clean-up its do_remove_doc does:
          it notes which documents the branch holds, drops the branch_docs
          rows, and hands every document with no surviving reference to
          reclaim_unreferenced_doc - deleting its cached files from disk and
          its doc_data, files and docs rows, and retiring its id.

          Python's _do_delete_branch deletes the branch_docs and branches rows
          and stops, which is what MATLAB did before a0bb373. So a database
          that has had a branch deleted from Python keeps documents no branch
          references, with their field data and their ingested files, where
          the same operation in MATLAB would have removed them.

          The guard is worth stating because it is what makes the reclamation
          safe under DID's branch model: it fires only when NO branch_docs row
          for the document survives anywhere, so a document any other branch
          still holds is untouched. Porting this means reusing that same test,
          not deleting whatever the branch happened to hold.
        input_arguments:
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          Both delete the branch's branch_docs rows and then the branches row.
          The guards around that live one level up, in database.delete_branch -
          see the delete_branch entry in bridge.yaml for those.

      - name: search
        python_name: search
        input_arguments:
          - name: query_obj
            type_matlab: "did.query"
            type_python: "Query"
          - name: branch_id
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: doc_ids
            type_python: "list[str]"
        decision_log: >
          Both use SQL-based search with fallback to brute-force for
          complex queries. Synchronized 2026-03-15.

      - name: get_docs
        python_name: get_docs
        decision_log: >
          Python adds bulk get_docs with OnMissing parameter.
          Synchronized 2026-03-16.

      - name: get_docs_by_branch
        matlab_name: ~   # Python-only, no MATLAB counterpart
        python_name: get_docs_by_branch
        decision_log: >
          Python-only convenience method. Returns all documents in a branch.
          Added 2026-03-16. Marked matlab_name: ~ on 2026-08-28 -- every other
          member entry's `name` is the MATLAB name, so without the marker a
          coverage check reads this as a bridge entry pointing at a MATLAB
          method that does not exist.

      - name: open_doc
        python_name: open_doc
        input_arguments:
          - name: doc_id
            type_matlab: "char"
            type_python: "str"
          - name: filename
            type_matlab: "char"
            type_python: "str"
          - name: customFileHandler
            type_matlab: "function_handle (name-value)"
            type_python: "callable (custom_file_handler=None)"
        decision_log: >
          Reworked in BOTH repos 2026-08-28, in lockstep. Both walk the
          document's locations, return the first that resolves to a readable
          local file, hand any remote location to a caller-supplied retriever,
          and raise when nothing can be reached.

          DID DOWNLOADS NOTHING ITSELF, in either language. Retrieval is
          supplied through customFileHandler / custom_file_handler, called as
          (destPath, sourcePath) and expected to produce a local file at
          destPath; both check that it did. NDI-matlab already uses this hook,
          passing a handler that resolves ndic://<datasetId>/<fileUid> by
          calling getFileDetails to mint a fresh pre-signed URL and then
          getFile to download it. Only ndic:// is supported for now; plain
          http(s) URLs are deliberately not handled by DID.

          MATLAB change: the 'url' branch, which called
          ndi.cloud.api.files.getFile directly, was removed. It made DID depend
          on NDI being on the path -- a lower-level package reaching for a
          higher-level one -- for a case NDI already covers through the hook.
          Every non-'file' type now goes to the handler.

          Python changes, three quiet bugs plus the new hook:

          1. locations["location"] was read directly, assuming a single dict.
             Documents may carry several locations per file -- the shipped
             demoFile.json template lists a local path AND a remote one for
             each -- so any MATLAB-written document raised TypeError.
          2. A remote location was rebased against the database directory like
             a relative path, producing /db/dir/ndic://d-123/f-abc.
          3. The resulting Fileobj was returned unopened. Fileobj.fopen()
             swallows the OSError and leaves fid None, so a caller that did not
             check fid read b"" and saw no error -- a missing file was
             indistinguishable from an empty one.

          Python raises FileAccessError, which carries MATLAB's identifier the
          way ValidationError does and subclasses FileNotFoundError so older
          callers keep working: FileRetrieval:UnsupportedType when a remote
          location has no handler, FileRetrieval:CustomHandlerFailed when the
          handler raises or produces no file, DID:SQLITEDB:open otherwise.

          CLOSED 2026-08-29: both languages now add the retrieved file to the
          file cache and serve later opens from there. Python's FileCache was
          a stub when this entry was written, so open_doc downloaded to
          PathConstants.temppath and re-fetched on every open; it now moves
          the retrieved file into the cache under its uid and touches it on a
          cache hit, as MATLAB's do_open_doc does. See the fileCache entry in
          did_matlab_python_bridge_file.yaml.

          CLOSED 2026-08-30: do_add_doc's ingestion path took no handler in
          either language, so DID-matlab still reached for
          ndi.cloud.api.files.getFile there. MATLAB now takes
          options.customFileHandler and Python takes custom_file_handler,
          plumbed through add_docs (DID-python#42). Rarely hit, because ingest
          defaults to 0 for url and ndicloud locations.

      - name: check_exist_doc
        python_name: exist_doc
        input_arguments:
          - name: document_id
            type_matlab: "char"
            type_python: "str | Document"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        output_arguments:
          - name: tf
            type_matlab: "logical"
            type_python: "bool"
          - name: file_path
            type_matlab: "char ('' when absent)"
            type_python: "str | None (None when absent)"
        decision_log: >
          Ported 2026-08-30 (DID-python#42). MATLAB splits this in two --
          database.exist_doc validates the document id and delegates to
          sqlitedb.check_exist_doc -- and Python does both in SQLiteDB.
          exist_doc, mirroring how open_doc is arranged here. The full
          rationale, the two outputs, and the deliberate '' -> None and
          shared-resolution decisions are recorded on the exist_doc entry in
          did_matlab_python_bridge.yaml.

          Both check the filesystem rather than trusting a `files` row: a row
          is inserted even when caching failed and the cached_location is
          empty, so isfile / os.path.isfile decides.

      - name: open_db
        python_name: _open_db
        decision_log: >
          MATLAB opens an mksqlite connection per operation; Python keeps one
          sqlite3 connection open for the session lifetime. Behavioral
          difference by design. Synchronized 2026-03-15. Split out of a
          combined "open_db / close_db" entry 2026-08-28 so each method
          resolves on its own.

      - name: close_db
        python_name: _close_db
        decision_log: >
          See open_db. Synchronized 2026-03-15. Split out of a combined
          entry 2026-08-28.

    decision_log: >
      Core database operations are synchronized. MATLAB recently changed
      URL download mechanism (websave -> ndi.cloud.api.files.getFile) which
      is MATLAB-ecosystem-specific; Python has no URL download path to
      mirror. The 2026-06-12 SQL-injection hardening (14439fb) was authored
      in lockstep with the Python parameterization/_sql_escape work already
      present here. Last full sync: 2026-03-15; drift re-checked 2026-08-28
      against MATLAB 14439fb.

  # -----------------------------------------------------------------------
  # did.implementations.doc2sql  (function module)
  # -----------------------------------------------------------------------
  - name: doc2sql
    type: function
    matlab_path: "+did/+implementations/doc2sql.m"
    matlab_last_sync_hash: "c618a05"
    python_path: "did/implementations/doc2sql.py"
    python_name: "doc_to_sql"

    methods:
      - name: doc2sql
        python_name: doc_to_sql
        input_arguments:
          - name: doc
            type_matlab: "did.document"
            type_python: "Document"
        output_arguments:
          - name: sql_metadata
            type_matlab: "struct array"
            type_python: "list[dict]"
        decision_log: >
          Both extract document properties into SQL-compatible meta-tables.
          Python handles both DID-python and MATLAB/NDI document formats
          for cross-language compatibility. Synchronized 2026-03-25.

    decision_log: >
      doc2sql contains the critical MATLAB-Python bridge logic for
      serializing documents to SQL. Python version handles both native
      and MATLAB document_class formats. Synchronized 2026-03-25.

      MATLAB c618a05 (2026-07-22) taught doc2sql to read did2-form
      superclasses. Ported 2026-08-29. did1 documents carry a superclass
      `.definition` path; did2 (V_delta / V_zeta) documents carry the name
      directly in `.class_name` and have no `.definition`. MATLAB errored
      outright on the did2 shape ("Unrecognized field name definition");
      Python's _get_superclass_str silently dropped the entry and wrote an
      empty meta.superclass column, so an isa() query returned a different
      result set in each language with no error in either -- a silent
      scientific divergence. _superclass_names_from now mirrors MATLAB's
      array-level preference exactly: `definition` wherever any entry has
      it, else `class_name`, else nothing. Deliberately NOT re-engineered
      into a per-entry union, matching the MATLAB commit's own reasoning --
      a MATLAB struct array cannot hold mixed fields, so the mixed shape
      does not arise from MATLAB. Regression: tests/test_doc2sql_superclass.py
      TestGetSuperclassStrDid2ClassName.

      Also ported 2026-08-29, from audriB's c968c95 in DID-python#26:
      _flatten_dict now mirrors doc2sql.m's getMetaTableFrom/recurseFields.
      A list of dicts (a MATLAB struct array) expands into one column per
      element suffixed _<1-based idx>, but only when the list has more than
      one element -- doc2sql.m's numElements > 1 rule -- and any residual
      scalar or mixed list is JSON-encoded. Previously every list was
      str()'d into a single column, storing a Python repr with single
      quotes: per-element fields were unsearchable and the stored string
      disagreed with what DID-matlab writes for the same document.
      Regression: tests/test_doc2sql_flatten.py.

  # -----------------------------------------------------------------------
  # did.implementations.binarydoc_matfid
  # -----------------------------------------------------------------------
  - name: binarydoc_matfid
    type: class
    matlab_path: "+did/+implementations/binarydoc_matfid.m"
    matlab_last_sync_hash: "2786be2"
    python_path: "did/implementations/binarydoc_matfid.py"
    python_class: "BinaryDocMatfid"
    inherits_matlab: "did.binarydoc & did.file.fileobj"
    inherits_python: "BinaryDoc, Fileobj"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB changed default permission from 'r' to 'rb' (commit 2786be2).
      Python BinaryDocMatfid inherits Fileobj which already opens in
      binary mode (fopen appends 'b'). Behaviorally in sync.

    properties:
      - name: key
        python_name: key
        type_matlab: "any"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: doc_unique_id
        python_name: doc_unique_id
        type_matlab: "any"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: machineformat
        python_name: machineformat
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          MATLAB default: 'l' (little-endian).
          Python default: 'l' (little-endian). Exact match.
          Synchronized 2026-03-15.

    methods:
      - name: binarydoc_matfid
        python_name: __init__
        kind: constructor
        decision_log: >
          MATLAB: binarydoc_matfid(fileProps, matfidProps).
          Python: BinaryDocMatfid(key, doc_unique_id, **kwargs).
          Synchronized 2026-03-15.

      - name: fclose
        python_name: fclose
        decision_log: >
          MATLAB resets permission to 'rb' after close (changed from 'r').
          Python closes file handle. Synchronized 2026-03-15.

    decision_log: >
      Binary mode change in MATLAB ('r' -> 'rb') aligns MATLAB with
      Python's existing behavior. Python already opens binary files
      correctly via Fileobj.fopen() binary-mode append.
      Synchronized 2026-04-13.

  # -----------------------------------------------------------------------
  # did.implementations.sqldb  (abstract intermediate class)
  # -----------------------------------------------------------------------
  - name: sqldb
    type: class
    matlab_path: "+did/+implementations/sqldb.m"
    matlab_last_sync_hash: "13463d1"
    python_path: "(not separately implemented)"
    python_class: "(merged into Database)"

    methods:
      - name: alldocids
        python_name: all_doc_ids
        python_path: "did/database.py"
        decision_log: >
          sqldb's only method. Python has no sqldb layer, so it lives on
          Database as all_doc_ids. Added to the bridge 2026-08-28 -- the
          mapping was described in this entry's prose but had no method entry,
          so a coverage check saw it as an unbridged public method.

    decision_log: >
      MATLAB has an intermediate abstract class sqldb between database
      and sqlitedb. Python merges this layer directly into Database
      and SQLiteDB. Synchronized 2026-03-15.

