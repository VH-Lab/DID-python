      MATLAB-specific wrapper around dumbjsondb for MATLAB file I/O.
      Not ported: DID-python's storage backend is SQLiteDB. Corrected
      2026-08-28 -- this previously read "Python implements DumbJsonDB
      directly in file.py", which overstated a dead-code stub; see the
      did.file.dumbjsondb entry in did_matlab_python_bridge_file.yaml.
      A matlab_last_sync_hash was added 2026-08-28: the entry had none, and
      without one it could never show drift -- the same blind spot that had
      hidden dumbjsondb and fileCache. Unported does not have to mean
      unwatched, so the file is tracked even though nothing is ported from it.

# =========================================================================
# Not applicable in Python
# =========================================================================
not_applicable:
  - name: ndi.cloud.api.files.getFile
    rationale: >
      MATLAB uses NDI cloud API for URL file downloads (added in sqlitedb.m
      commit 926c430). Not a direct port target: the NDI cloud API is
      MATLAB-ecosystem-specific. Python currently has no URL download path
      at all -- SQLiteDB.open_doc() resolves only local (absolute or
      db-relative) file locations -- so if remote locations are ever needed
      in Python it should be built with requests/urllib rather than ported.
      Tracked in the "Not Yet Ported" table in PORTING_INSTRUCTIONS.md.
