# did_matlab_python_bridge_file.yaml — File I/O classes and utilities
# Contract for did.file namespace.
#
# In MATLAB, the file module is split across multiple files in +did/+file/.
# In Python, these are consolidated into a single did/file.py module.
#
# To check for drift, run:
#   git -C <DID-matlab> log <matlab_last_sync_hash>..HEAD -- <matlab_path>

project_metadata:
  bridge_version: "1.0"
  matlab_repo: "VH-Lab/DID-matlab"
  python_repo: "VH-Lab/DID-python"
  naming_policy: "Strict MATLAB Mirror — Python names use snake_case equivalents"
  indexing_policy: "Semantic Parity (MATLAB 1-based, Python 0-based)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # -----------------------------------------------------------------------
  # did.file.fileobj
  # -----------------------------------------------------------------------
  - name: fileobj
    type: class
    matlab_path: "+did/+file/fileobj.m"
    matlab_last_sync_hash: "02c83c5"
    python_path: "did/file.py"
    python_class: "Fileobj"
    inherits_matlab: "handle"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB made three changes but Python is already correct:
      1. Default permission 'r' -> 'rb': Python Fileobj.fopen() already
         appends 'b' if not present (line 88-89 of file.py), so files are
         always opened in binary mode regardless of the permission string.
      2. fread default 'char' -> 'uint8': Python fread returns raw bytes,
         equivalent to uint8.
      3. fwrite permission check for 'r+': Python relies on the native file
         object to reject writes on read-only files.
      MATLAB is now aligned with Python's existing behavior.

    properties:
      - name: fullpathfilename
        python_name: fullpathfilename
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fid
        python_name: fid
        type_matlab: "double (MATLAB file ID)"
        type_python: "file object"
        decision_log: >
          MATLAB uses numeric file ID from fopen().
          Python uses native file object. Semantic equivalent.
          Synchronized 2026-03-15.

      - name: permission
        python_name: permission
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          MATLAB default changed: 'r' -> 'rb' (commit 02c83c5).
          Python default string is 'r' but fopen() appends 'b' automatically,
          so effective mode is always binary. Behaviorally in sync.

      - name: machineformat
        python_name: machineformat
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          MATLAB: 'n' (native). Python: 'n'.
          Used for endianness control. Synchronized 2026-03-15.

    methods:
      - name: fileobj
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: fullpathfilename
            type_matlab: "char"
            type_python: "str"
          - name: permission
            type_matlab: "char"
            type_python: "str"
          - name: machineformat
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: fileobj(Name=Value pairs).
          Python: Fileobj(fullpathfilename, permission, machineformat).
          Synchronized 2026-03-15.

      - name: setproperties
        python_name: set_properties
        decision_log: >
          MATLAB: setproperties(Name, Value, ...).
          Python: set_properties(fullpathfilename, permission, machineformat).
          Synchronized 2026-03-15.

      - name: fopen
        python_name: fopen
        input_arguments:
          - name: permission
            type_matlab: "char"
            type_python: "str"
          - name: machineformat
            type_matlab: "char"
            type_python: "str"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fclose
        python_name: fclose
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fseek
        python_name: fseek
        input_arguments:
          - name: offset
            type_matlab: "double"
            type_python: "int"
          - name: reference
            type_matlab: "char ('bof'|'cof'|'eof')"
            type_python: "int (0|1|2)"
        decision_log: >
          MATLAB uses string references ('bof','cof','eof').
          Python uses integer constants (0, 1, 2) matching os.SEEK_*.
          Synchronized 2026-03-15.

      - name: ftell
        python_name: ftell
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: frewind
        python_name: frewind
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: feof
        python_name: feof
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fwrite
        python_name: fwrite
        input_arguments:
          - name: data
            type_matlab: "any"
            type_python: "bytes"
          - name: precision
            type_matlab: "char"
            type_python: "(not used)"
          - name: skip
            type_matlab: "double"
            type_python: "(not used)"
        decision_log: >
          MATLAB fwrite() now allows 'r+' permission (commit 02c83c5).
          Previous check rejected anything starting with 'r'.
          Python fwrite() relies on native file object to reject writes
          on read-only files. No Python change needed.

      - name: fread
        python_name: fread
        input_arguments:
          - name: count
            type_matlab: "double"
            type_python: "int"
          - name: precision
            type_matlab: "char (default: 'uint8', was 'char')"
            type_python: "(not used)"
        decision_log: >
          MATLAB fread() default precision changed: 'char' -> 'uint8'
          (commit 02c83c5). Python fread returns raw bytes, which is
          equivalent to uint8.

          Deviation: MATLAB returns [data, count]; Python returns the data
          alone, since len(data) is the count. Fixed 2026-08-28 -- the
          unopened-file path returned the 2-tuple (b"", 0) while the success
          path returned bytes, so the return type depended on whether the open
          had succeeded. A caller doing fread().decode() got AttributeError on
          a tuple, and one doing "data, count = fread()" unpacked correctly
          only when the read happened to return exactly two bytes. Now b"" in
          both cases.

          Both languages read an unopened file as empty rather than raising
          (MATLAB: data = [], count = 0 when fid < 0), so check fid to tell an
          empty file from one that could not be opened.

      - name: fgetl
        python_name: fgetl
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fgets
        python_name: fgets
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: ferror
        python_name: ferror
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fscanf
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB. Not ported to Python.

      - name: fprintf
        python_name: ~   # not ported
        decision_log: >
          MATLAB fprintf() permission check updated to check only
          first character of permission. Python does not implement
          fprintf (use Python print/write). Not applicable.

      - name: fileparts
        python_name: fileparts
        decision_log: >
          MATLAB: [pathstr, name, ext] = fileparts().
          Python: fileparts() -> (str, str). Returns (dir, name).
          Synchronized 2026-03-15.

    decision_log: >
      MATLAB made three changes (binary mode default, fread precision,
      fwrite permission check) in commits 6dd2f23, 2786be2, 02c83c5.
      Python Fileobj already opens in binary mode (fopen appends 'b'),
      fread returns raw bytes (equiv to uint8), and fwrite relies on
      native file object for permission enforcement. Behaviorally in sync.
      Updated matlab_last_sync_hash to current. Synchronized 2026-04-13.

  # -----------------------------------------------------------------------
  # did.file.readonly_fileobj
  # -----------------------------------------------------------------------
  - name: readonly_fileobj
    type: class
    matlab_path: "+did/+file/readonly_fileobj.m"
    matlab_last_sync_hash: "6dd2f23"
    python_path: "did/file.py"
    python_class: "ReadOnlyFileobj"
    inherits_matlab: "did.file.fileobj"
    inherits_python: "Fileobj"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB changed default from 'r' to 'rb' (commit 6dd2f23).
      Python ReadOnlyFileobj stores 'r' as default but the parent
      Fileobj.fopen() appends 'b' automatically, so files are
      always opened in binary mode. Behaviorally in sync.

    methods:
      - name: readonly_fileobj
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: options
            type_matlab: "name-value pairs"
            type_python: "fullpathfilename, machineformat"
        decision_log: >
          MATLAB: readonly_fileobj(Name=Value).
          Python: ReadOnlyFileobj(fullpathfilename, machineformat).
          Synchronized 2026-03-15.

      - name: fopen
        python_name: fopen
        input_arguments:
          - name: permission
            type_matlab: "char (forced to 'rb')"
            type_python: "str (forced to 'r')"
        decision_log: >
          MATLAB now forces 'rb'. Python forces 'r' but parent
          fopen() appends 'b', so effective mode is 'rb'.
          Behaviorally in sync.

    decision_log: >
      OUT OF SYNC. MATLAB enforces 'rb' for read-only files.
      Python still uses 'r'. Should update Python to use 'rb'
      for binary file consistency.

  # -----------------------------------------------------------------------
  # did.file.binaryTable
  # -----------------------------------------------------------------------
  # NOTE (2026-08-29): ported. binaryTable is the storage engine behind
  # did.file.fileCache, which builds one over the cache's .fileCacheInfo file,
  # and fileCache is on the document-open path: sqlitedb.do_open_doc consults
  # the cache and touches what it reads. Python's version was construction plus
  # a "Simplified implementation" of read_row that returned undecoded bytes and
  # ignored elements_per_column, with the write path absent entirely; it is now
  # a full typed implementation over the same little-endian layout, so a table
  # written by either language is readable by the other. Pinned by
  # tests/test_binary_table.py, which asserts the byte layout and not only the
  # round trip.
  - name: binaryTable
    type: class
    matlab_path: "+did/+file/binaryTable.m"
    matlab_last_sync_hash: "ee8b33b"
    python_path: "did/file.py"
    python_class: "BinaryTable"
    inherits_matlab: "handle"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB changed read permissions from 'r' to 'rb' (6 occurrences,
      commit 2786be2). Python opens every table file in binary mode, so this
      is behaviorally in sync.

    properties:
      - name: file
        python_name: file
        type_matlab: "did.file.fileobj"
        type_python: "Fileobj"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: recordType
        python_name: record_type
        type_matlab: "cell"
        type_python: "list[str]"
        decision_log: >
          A MATLAB precision string per column ('char', 'double', 'uint64',
          ...). Corrected 2026-08-29: the bridge previously described the
          Python side as "a single string, simplified representation", which
          was a description of the stub. It is a per-column list in both
          languages, and the constructor now rejects a type it cannot encode.

      - name: recordSize
        python_name: record_size
        type_matlab: "uint16 vector"
        type_python: "list[int]"
        decision_log: >
          Byte width per column. Python additionally checks each entry against
          the column's type and element count at construction, since a
          contradiction there misplaces every row boundary in the file
          silently.

      - name: elementsPerColumn
        python_name: elements_per_column
        type_matlab: "uint16 vector"
        type_python: "list[int]"
        decision_log: >
          Elements per column. Corrected 2026-08-29: previously recorded as a
          single int on the Python side, which described the stub -- the stub
          ignored this value entirely.

      - name: headerSize
        python_name: header_size
        type_matlab: "uint16"
        type_python: "int"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: hasLock
        python_name: has_lock
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match. Synchronized 2026-03-15."

    methods:
      - name: binaryTable
        python_name: __init__
        kind: constructor
        decision_log: >
          Same five arguments in the same order. Python validates the column
          descriptions against each other; MATLAB does not.

      - name: getSize
        python_name: get_size
        decision_log: "Both return (rows, columns, data bytes)."

      - name: readHeader
        python_name: read_header
        decision_log: >
          Both return the header bytes and both return empty for a file that
          does not exist, rather than raising -- MATLAB because fopen leaves
          fid < 0, Python explicitly.

      - name: writeHeader
        python_name: write_header
        decision_log: >
          Both write over the start of the file and touch nothing past the
          data given. Both create the file when it is absent ('w' in MATLAB,
          "wb" in Python); Python then pads a new file out to header_size, or
          row 1 would begin before the header ended.

      - name: getLock
        python_name: get_lock
        decision_log: >
          Exact match, re-entrant the same way: a nested call returns an empty
          key and the matching release is a no-op, so the outermost caller
          owns the lock.

      - name: releaseLock
        python_name: release_lock
        decision_log: "Exact match."

      - name: lockFileName
        python_name: lock_file_name
        decision_log: >
          Both return "<file>-lock". Corrected 2026-08-29: Python returned
          "<file>.lock", so two languages guarding one table checked out two
          different lock files and excluded each other not at all. See the
          checkout_lock_file entry.

      - name: tempFileName
        python_name: temp_file_name
        decision_log: >
          Both return "<file>-temp". Same correction as lockFileName.

      - name: rowSize
        python_name: row_size
        decision_log: "Both sum the per-column byte sizes."

      - name: compare
        kind: static
        python_name: compare
        decision_log: >
          Both return 1 when the first value sorts first, -1 when it sorts
          last, and 0 for equal; numbers compare numerically, text
          alphabetically, and a cell/list by its first entry. Ported
          2026-08-29 along with findRow, which is its only caller.

      - name: readRow
        python_name: read_row
        decision_log: >
          Ported 2026-08-29. Both decode a column into typed values using
          recordType and elementsPerColumn: a 'char' column comes back as
          text, a numeric column with one element per row as a number, and
          with several as a list. Both accept a row number, a list of them, or
          "all rows" -- MATLAB spells that Inf, Python accepts None or
          math.inf.

          Python returns a single value for a single row and a list otherwise;
          MATLAB returns an array whose rows are the rows requested. Same
          content, shaped the way each language would shape it.

      - name: insertRow
        python_name: insert_row
        decision_log: >
          Ported 2026-08-29. Both append when the insertion point is the last
          row and otherwise splice through a temp file in 1 MB chunks.

          Both refuse anything past r. MATLAB's bound check admitted r+1
          and then took the copy branch, writing the new row past the end of
          the data; fixed in DID-matlab#158, which this entry previously
          recorded as an open divergence.

      - name: deleteRow
        python_name: delete_row
        decision_log: >
          Ported 2026-08-29. Both copy around the deleted row through a temp
          file, and both refuse row > rows. MATLAB admitted r+1, the same
          off-by-one as insertRow; fixed in DID-matlab#158.

      - name: writeEntry
        python_name: write_entry
        decision_log: >
          Ported 2026-08-29. Both overwrite one entry in place and both reject
          a value of the wrong type or the wrong element count.

      - name: writeTable
        python_name: write_table
        decision_log: >
          Ported 2026-08-29. Both replace every row and carry the header
          over unchanged.

      - name: findRow
        python_name: find_row
        decision_log: >
          Ported 2026-08-29, including the binary search. Both return
          (row, wouldBe): row is the 1-based row or 0 when absent, and wouldBe
          is the row to insert *after* -- exactly what insertRow takes -- when
          searching a sorted column, or NaN otherwise. The recursion, the
          bounds arithmetic and the lastmove condition follow MATLAB's, so the
          two agree on where a missing value belongs and not merely on whether
          it is present.

    decision_log: >
      SYNCHRONIZED 2026-08-29. Previously a partial port: read_row returned
      raw bytes and insertRow, deleteRow, writeEntry, writeTable, findRow and
      compare were absent. The full typed path is now present in both
      languages over one shared little-endian on-disk layout.

  # -----------------------------------------------------------------------
  # did.file.fileCache
  # -----------------------------------------------------------------------
  - name: fileCache
    type: class
    matlab_path: "+did/+file/fileCache.m"
    matlab_last_sync_hash: "50e449c"
    python_path: "did/file.py"
    python_class: "FileCache"
    inherits_matlab: "handle"
    out_of_sync: false
    out_of_sync_reason: >
      RESOLVED 2026-08-29. All three problems recorded here on 2026-08-28 are
      fixed; kept as the record of what was wrong and what closed it.

      1. The Python class was a stub -- construction and info-file read/write
         and nothing else, with no addFile, removeFile, isFile, fileList,
         resizeAndAdd, touch or clear, so nothing could be cached and
         maxSize/reduceSize were stored but never enforced. All of them are
         now ported, eviction included.

      2. It was duplicated. Two unrelated classes were named FileCache --
         did/file.py:FileCache and a three-line did/common.py:FileCache
         holding a path and a number -- and did.common.get_cache() returned
         the emptier one. The common.py class is gone; get_cache() returns
         did.file.FileCache, as MATLAB's did.common.getCache() returns a
         did.file.fileCache.

      3. THE ON-DISK FORMATS WERE INCOMPATIBLE UNDER THE SAME FILENAME.
         Both languages call the index ".fileCacheInfo"; MATLAB wrote
         binaryTable's fixed binary layout and Python wrote JSON, so neither
         could read the other's file. Python now writes MATLAB's layout: a
         26-byte header (fileNameCharacters as uint16, then maxSize,
         reduceSize and currentSize as uint64) followed by fixed-width rows of
         {char[fileNameCharacters], double, uint64} -- name, last-accessed
         time as a MATLAB datenum, size. tests/test_file_cache.py builds that
         file byte by byte, without going through FileCache, and reads it back
         through FileCache.

      This matters because MATLAB's cache is not a side feature: sqlitedb.
      do_open_doc consults filecachepath when opening a document's file and
      touches what it finds. Python's open_doc now does the same.

      Ordering note, now discharged: the format had to be aligned before the
      path. PathConstants.filecachepath still differs between the languages
      (see did_matlab_python_bridge_util.yaml); aligning it first would have
      pointed both at one directory in which each corrupted the other's index.
      With the formats agreed, that path change is now safe to make.

    properties:
      - name: directoryName
        python_name: directory_name
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match; must be an existing directory in both."

      - name: fileNameCharacters
        python_name: file_name_characters
        type_matlab: "uint16 >= 32"
        type_python: "int >= 32"
        decision_log: >
          The fixed width of every name in the cache, which is what makes the
          index rows fixed-width. Both refuse a value below 32, both refuse to
          change it on an existing cache, and both take 33 from getCache --
          the length of a did unique id.

      - name: maxSize
        python_name: max_size
        type_matlab: "uint64 >= 1000"
        type_python: "int >= 1000"
        decision_log: >
          Both default to 100e9 and both enforce the lower bound -- MATLAB
          through a property validator, Python in set_properties.

      - name: reduceSize
        python_name: reduce_size
        type_matlab: "uint64 >= 800"
        type_python: "int >= 800"
        decision_log: >
          Both default to 80e9, both enforce the lower bound, and both require
          reduceSize < maxSize.

      - name: currentSize
        python_name: current_size
        type_matlab: "uint64"
        type_python: "int"
        decision_log: "Exact match; stored in the info-file header in both."

      - name: binaryTable
        python_name: binary_table
        type_matlab: "did.file.binaryTable"
        type_python: "BinaryTable"
        decision_log: >
          Corrected 2026-08-29. Python backed the index with JSON under a
          'files' key -- recorded here as "deviation by design", which
          understated it: the two languages could not read each other's index.
          Python now builds a BinaryTable over the same file with the same
          column description.

      - name: cacheInfoFileName
        python_name: CACHE_INFO_FILE_NAME
        type_matlab: "constant char"
        type_python: "class constant str"
        decision_log: "Both are '.fileCacheInfo'."

    methods:
      - name: fileCache
        python_name: __init__
        kind: constructor
        decision_log: >
          MATLAB: fileCache(directoryName, fileNameCharacters, maxSize,
          reduceSize). Python: FileCache(directory_name,
          file_name_characters=None, max_size=None, reduce_size=None). The
          None defaults reproduce MATLAB's nargin checks: an existing cache
          keeps its stored settings and only an argument actually passed
          overrides them, so re-opening a cache does not silently resize it.
          Both refuse to change fileNameCharacters on an existing cache.

      - name: setProperties
        python_name: set_properties
        decision_log: >
          Both write the size limits into the info-file header and both keep
          the stored fileNameCharacters when the file already exists.

      - name: getProperties
        python_name: get_properties
        decision_log: >
          Corrected 2026-08-29. Both now read the header and return the four
          values -- MATLAB as a struct, Python as a dict with MATLAB's field
          names. The previous Python counterpart, _load_properties, parsed
          JSON into instance attributes and returned nothing.

      - name: addFile
        python_name: add_file
        decision_log: >
          Ported 2026-08-29. Both move the file in by default and copy on
          request (MATLAB 'copy',true; Python copy=True), both refuse a name
          whose length is not fileNameCharacters, and both refuse a name
          already in the cache.

      - name: removeFile
        python_name: remove_file
        decision_log: >
          Ported 2026-08-29. Both drop the row, subtract its size from
          currentSize, and delete the file.

      - name: clear
        python_name: clear
        decision_log: >
          Ported 2026-08-29. Both empty the index, reset currentSize and
          delete the files, listing the directory rather than the index.

      - name: isFile
        python_name: is_file
        decision_log: "Ported 2026-08-29. Both search the index by name."

      - name: fileList
        python_name: file_list
        decision_log: >
          Ported 2026-08-29. Both return names, sizes and last-access times,
          from the index by default and from a directory listing when asked
          (MATLAB useCatalog, Python use_catalog), in which case last-access
          is NaN in both.

      - name: resizeAndAdd
        python_name: resize_and_add
        decision_log: >
          Ported 2026-08-29, including the eviction arithmetic: least recently
          accessed first, deleting until the total would sit under reduceSize,
          then rewriting the index sorted by name. Both refuse an addition
          larger than the whole cache.

          One remaining divergence: Python refuses to add a name already
          present, where MATLAB proceeds with the NaN wouldBe that findRow
          returns for a name it found. MATLAB also used to index its
          row-building cell with the loop variable rather than the column
          (data_here{i} where data_here{1} is meant), so adding more than one
          file at once catalogued every file after the first under the first
          file's name; fixed in DID-matlab#158.

      - name: touch
        python_name: touch
        decision_log: >
          Ported 2026-08-29. Both update the last-access time and report
          whether the name was in the index.

      - name: infoFileName
        python_name: _info_file_name
        decision_log: "Exact match."

    decision_log: >
      SYNCHRONIZED 2026-08-29. Was a stub with an incompatible on-disk format
      and a duplicate class shadowing it; is now a full port over MATLAB's
      binary .fileCacheInfo layout, wired into open_doc the way MATLAB wires
      it into do_open_doc. Sync hash unchanged at 3aa892d -- MATLAB has not
      touched fileCache.m, so the gap was always in the port, not in drift.

functions:

  - name: mustBeValidPermission
    type: function
    matlab_path: "+did/+file/mustBeValidPermission.m"
    matlab_last_sync_hash: "2786be2"
    python_path: "did/file.py"
    python_name: "must_be_valid_permission"
    out_of_sync: false
    decision_log: >
      MATLAB added 'b' (binary) mode variants (commit 2786be2).
      Python must_be_valid_permission already accepts binary modes
      (rb, wb, ab, r+b, w+b, a+b). In sync. Synchronized 2026-04-13.

  - name: checkout_lock_file
    type: function
    matlab_path: "+did/+file/checkout_lock_file.m"
    matlab_last_sync_hash: "3aa892d"
    python_path: "did/file.py"
    python_name: "checkout_lock_file"
    decision_log: >
      Corrected 2026-08-29. Both take the name of the lock file itself -- the
      MATLAB docstring's own example passes "myfile.txt-lock". Python appended
      ".lock" to whatever it was given, so a MATLAB process guarding a file
      contended for "<file>-lock" while a Python process guarding the same
      file contended for "<file>.lock": the two never excluded each other,
      which is exactly the case the lock exists for now that both languages
      share a file cache directory.

      The contents had to be aligned too, and that is tracked separately --
