not_applicable:
  # did.file.fileCache was listed here until 2026-08-28. It has a real (if
  # stub-level) Python counterpart, so it is now tracked as a class entry
  # above and is covered by the drift check.
  - name: did.file.dumbjsondb
    rationale: >
      Deliberately not ported. DID-python's storage backend is SQLiteDB;
      there is no plan to carry the JSON-file document store across.
      NOTE (2026-08-28): the previous rationale here read "MATLAB
      dumbjsondb has a Python equivalent (DumbJsonDB in file.py)", which
      overstated the situation. A DumbJsonDB class does exist in file.py,
      but it arrived with the initial bulk port commit (97ba45c) and is
      dead code: nothing in src/ or tests/ imports, instantiates or
      exercises it, and it implements only the parameter file, versioned
      read/add and version listing -- no binary files, search, remove,
      clear, alldocids or document metadata. It is a vestigial stub, not
      a port. Either delete it or, if a JSON backend is ever wanted,
      promote this to a tracked class entry and port it properly; until
      then it stays out of the drift check by design.
