# did_matlab_python_bridge_file.yaml — File I/O classes and utilities
# Contract for did.file namespace.
#
# In MATLAB, the file module is split across multiple files in +did/+file/.
# In Python, these are consolidated into a single did/file.py module.
#
# To check for drift, run:
#   git -C <DID-matlab> log <matlab_last_sync_hash>..HEAD -- <matlab_path>

project_metadata:
  bridge_version: "1.0"
  matlab_repo: "VH-Lab/DID-matlab"
  python_repo: "VH-Lab/DID-python"
  naming_policy: "Strict MATLAB Mirror — Python names use snake_case equivalents"
  indexing_policy: "Semantic Parity (MATLAB 1-based, Python 0-based)"

# =========================================================================
# Classes
# =========================================================================
classes:

  # -----------------------------------------------------------------------
  # did.file.fileobj
  # -----------------------------------------------------------------------
  - name: fileobj
    type: class
    matlab_path: "+did/+file/fileobj.m"
    matlab_last_sync_hash: "02c83c5"
    python_path: "did/file.py"
    python_class: "Fileobj"
    inherits_matlab: "handle"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB made three changes but Python is already correct:
      1. Default permission 'r' -> 'rb': Python Fileobj.fopen() already
         appends 'b' if not present (line 88-89 of file.py), so files are
         always opened in binary mode regardless of the permission string.
      2. fread default 'char' -> 'uint8': Python fread returns raw bytes,
         equivalent to uint8.
      3. fwrite permission check for 'r+': Python relies on the native file
         object to reject writes on read-only files.
      MATLAB is now aligned with Python's existing behavior.

    properties:
      - name: fullpathfilename
        python_name: fullpathfilename
        type_matlab: "char"
        type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fid
        python_name: fid
        type_matlab: "double (MATLAB file ID)"
        type_python: "file object"
        decision_log: >
          MATLAB uses numeric file ID from fopen().
          Python uses native file object. Semantic equivalent.
          Synchronized 2026-03-15.

      - name: permission
        python_name: permission
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          MATLAB default changed: 'r' -> 'rb' (commit 02c83c5).
          Python default string is 'r' but fopen() appends 'b' automatically,
          so effective mode is always binary. Behaviorally in sync.

      - name: machineformat
        python_name: machineformat
        type_matlab: "char"
        type_python: "str"
        decision_log: >
          MATLAB: 'n' (native). Python: 'n'.
          Used for endianness control. Synchronized 2026-03-15.

    methods:
      - name: fileobj
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: fullpathfilename
            type_matlab: "char"
            type_python: "str"
          - name: permission
            type_matlab: "char"
            type_python: "str"
          - name: machineformat
            type_matlab: "char"
            type_python: "str"
        decision_log: >
          MATLAB: fileobj(Name=Value pairs).
          Python: Fileobj(fullpathfilename, permission, machineformat).
          Synchronized 2026-03-15.

      - name: setproperties
        python_name: set_properties
        decision_log: >
          MATLAB: setproperties(Name, Value, ...).
          Python: set_properties(fullpathfilename, permission, machineformat).
          Synchronized 2026-03-15.

      - name: fopen
        python_name: fopen
        input_arguments:
          - name: permission
            type_matlab: "char"
            type_python: "str"
          - name: machineformat
            type_matlab: "char"
            type_python: "str"
          - name: filename
            type_matlab: "char"
            type_python: "str"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fclose
        python_name: fclose
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fseek
        python_name: fseek
        input_arguments:
          - name: offset
            type_matlab: "double"
            type_python: "int"
          - name: reference
            type_matlab: "char ('bof'|'cof'|'eof')"
            type_python: "int (0|1|2)"
        decision_log: >
          MATLAB uses string references ('bof','cof','eof').
          Python uses integer constants (0, 1, 2) matching os.SEEK_*.
          Synchronized 2026-03-15.

      - name: ftell
        python_name: ftell
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: frewind
        python_name: frewind
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: feof
        python_name: feof
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fwrite
        python_name: fwrite
        input_arguments:
          - name: data
            type_matlab: "any"
            type_python: "bytes"
          - name: precision
            type_matlab: "char"
            type_python: "(not used)"
          - name: skip
            type_matlab: "double"
            type_python: "(not used)"
        decision_log: >
          MATLAB fwrite() now allows 'r+' permission (commit 02c83c5).
          Previous check rejected anything starting with 'r'.
          Python fwrite() relies on native file object to reject writes
          on read-only files. No Python change needed.

      - name: fread
        python_name: fread
        input_arguments:
          - name: count
            type_matlab: "double"
            type_python: "int"
          - name: precision
            type_matlab: "char (default: 'uint8', was 'char')"
            type_python: "(not used)"
        decision_log: >
          MATLAB fread() default precision changed: 'char' -> 'uint8'
          (commit 02c83c5). Python fread returns raw bytes, which is
          equivalent to uint8.

          Deviation: MATLAB returns [data, count]; Python returns the data
          alone, since len(data) is the count. Fixed 2026-08-28 -- the
          unopened-file path returned the 2-tuple (b"", 0) while the success
          path returned bytes, so the return type depended on whether the open
          had succeeded. A caller doing fread().decode() got AttributeError on
          a tuple, and one doing "data, count = fread()" unpacked correctly
          only when the read happened to return exactly two bytes. Now b"" in
          both cases.

          Both languages read an unopened file as empty rather than raising
          (MATLAB: data = [], count = 0 when fid < 0), so check fid to tell an
          empty file from one that could not be opened.

      - name: fgetl
        python_name: fgetl
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fgets
        python_name: fgets
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: ferror
        python_name: ferror
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: fscanf
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB. Not ported to Python.

      - name: fprintf
        python_name: ~   # not ported
        decision_log: >
          MATLAB fprintf() permission check updated to check only
          first character of permission. Python does not implement
          fprintf (use Python print/write). Not applicable.

      - name: fileparts
        python_name: fileparts
        decision_log: >
          MATLAB: [pathstr, name, ext] = fileparts().
          Python: fileparts() -> (str, str). Returns (dir, name).
          Synchronized 2026-03-15.

    decision_log: >
      MATLAB made three changes (binary mode default, fread precision,
      fwrite permission check) in commits 6dd2f23, 2786be2, 02c83c5.
      Python Fileobj already opens in binary mode (fopen appends 'b'),
      fread returns raw bytes (equiv to uint8), and fwrite relies on
      native file object for permission enforcement. Behaviorally in sync.
      Updated matlab_last_sync_hash to current. Synchronized 2026-04-13.

  # -----------------------------------------------------------------------
  # did.file.readonly_fileobj
  # -----------------------------------------------------------------------
  - name: readonly_fileobj
    type: class
    matlab_path: "+did/+file/readonly_fileobj.m"
    matlab_last_sync_hash: "6dd2f23"
    python_path: "did/file.py"
    python_class: "ReadOnlyFileobj"
    inherits_matlab: "did.file.fileobj"
    inherits_python: "Fileobj"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB changed default from 'r' to 'rb' (commit 6dd2f23).
      Python ReadOnlyFileobj stores 'r' as default but the parent
      Fileobj.fopen() appends 'b' automatically, so files are
      always opened in binary mode. Behaviorally in sync.

    methods:
      - name: readonly_fileobj
        python_name: __init__
        kind: constructor
        input_arguments:
          - name: options
            type_matlab: "name-value pairs"
            type_python: "fullpathfilename, machineformat"
        decision_log: >
          MATLAB: readonly_fileobj(Name=Value).
          Python: ReadOnlyFileobj(fullpathfilename, machineformat).
          Synchronized 2026-03-15.

      - name: fopen
        python_name: fopen
        input_arguments:
          - name: permission
            type_matlab: "char (forced to 'rb')"
            type_python: "str (forced to 'r')"
        decision_log: >
          MATLAB now forces 'rb'. Python forces 'r' but parent
          fopen() appends 'b', so effective mode is 'rb'.
          Behaviorally in sync.

    decision_log: >
      OUT OF SYNC. MATLAB enforces 'rb' for read-only files.
      Python still uses 'r'. Should update Python to use 'rb'
      for binary file consistency.

  # -----------------------------------------------------------------------
  # did.file.binaryTable
  # -----------------------------------------------------------------------
  # NOTE (2026-08-28, corrected): nothing in DID-PYTHON's src/ or tests/
  # constructs a BinaryTable, which is why a stubbed read_row could sit under a
  # "Synchronized" note unnoticed. That is a statement about the Python side
  # only. In DID-matlab binaryTable is live: it is the storage engine behind
  # did.file.fileCache, which builds one over the cache's .fileCacheInfo file
  # and calls readHeader, writeHeader, getLock, findRow and releaseLock -- and
  # fileCache is on the document-open path, since sqlitedb.do_open_doc consults
  # the cache and calls touch() on a hit. So these entries describe a live
  # MATLAB subsystem with an unexercised Python counterpart, not a subsystem
  # that is dead in both languages.
  - name: binaryTable
    type: class
    matlab_path: "+did/+file/binaryTable.m"
    matlab_last_sync_hash: "2786be2"
    python_path: "did/file.py"
    python_class: "BinaryTable"
    inherits_matlab: "handle"
    out_of_sync: false
    out_of_sync_reason: >
      MATLAB changed read permissions from 'r' to 'rb' (6 occurrences,
      commit 2786be2). Python BinaryTable uses Fileobj which already
      opens in binary mode (fopen appends 'b'). Behaviorally in sync.

    properties:
      - name: file
        python_name: file
        type_matlab: "did.file.fileobj"
        type_python: "Fileobj"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: recordType
        python_name: record_type
        type_matlab: "cell"
        type_python: "str"
        decision_log: >
          MATLAB: cell array of type strings.
          Python: single string. Simplified representation.
          Synchronized 2026-03-15.

      - name: recordSize
        python_name: record_size
        type_matlab: "uint16 vector"
        type_python: "list"
        decision_log: "Equivalent. Synchronized 2026-03-15."

      - name: elementsPerColumn
        python_name: elements_per_column
        type_matlab: "uint16 vector"
        type_python: "int"
        decision_log: >
          MATLAB: vector (per-column). Python: single int.
          Synchronized 2026-03-15.

      - name: headerSize
        python_name: header_size
        type_matlab: "uint16"
        type_python: "int"
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: hasLock
        python_name: has_lock
        type_matlab: "logical"
        type_python: "bool"
        decision_log: "Exact match. Synchronized 2026-03-15."

    methods:
      - name: binaryTable
        python_name: __init__
        kind: constructor
        decision_log: "Exact match. Synchronized 2026-03-15."

      - name: getSize
        python_name: get_size
        decision_log: >
          MATLAB: getSize(). Python: get_size().
          Synchronized 2026-03-15.

      - name: readHeader
        python_name: read_header
        decision_log: >
          MATLAB: readHeader(). Python: read_header().
          MATLAB now uses 'rb' permission for reading.
          Synchronized 2026-03-15.

      - name: writeHeader
        python_name: write_header
        decision_log: >
          MATLAB: writeHeader(). Python: write_header().
          Synchronized 2026-03-15.

      - name: getLock
        python_name: get_lock
        decision_log: >
          Exact match; both take the multi-thread lock before a write.
          Added to the bridge 2026-08-28 -- ported but previously untracked.

      - name: releaseLock
        python_name: release_lock
        decision_log: >
          Exact match. Added to the bridge 2026-08-28 -- ported but previously
          untracked.

      - name: lockFileName
        python_name: lock_file_name
        decision_log: >
          Exact match. Added to the bridge 2026-08-28 -- ported but previously
          untracked.

      - name: tempFileName
        python_name: temp_file_name
        decision_log: >
          Exact match. Added to the bridge 2026-08-28 -- ported but previously
          untracked.

      - name: rowSize
        python_name: row_size
        decision_log: >
          Exact match; both sum the per-column byte sizes. Added to the bridge
          2026-08-28 -- ported but previously untracked.

      - name: compare
        kind: static
        python_name: ~   # not ported
        decision_log: >
          MATLAB static helper used by findRow to compare two values of the
          table's record type. Not ported, because findRow is not ported.
          Added to the bridge 2026-08-28 -- previously untracked.

      - name: readRow
        python_name: read_row
        decision_log: >
          Synchronized 2026-03-15; NOT synchronized in behavior, corrected
          2026-08-28. MATLAB's readRow decodes the row into typed data using
          the table's recordType and elementsPerColumn. Python's read_row seeks
          to the right offset and then returns the raw bytes of a single
          column: it never maps the MATLAB type strings onto struct formats and
          ignores elements_per_column entirely. Its own comments say as much
          ("Simplified implementation", "Placeholder for reading data"). The
          two return different things for the same call.

          Impact on Python callers is low only because nothing in DID-python
          constructs a BinaryTable. It is not low in the abstract: MATLAB uses
          binaryTable to read and write the file cache's on-disk format, so a
          Python reader that returns undecoded bytes could not read a
          MATLAB-written table. See the class-level note and the fileCache
          entry.

      - name: insertRow
        python_name: ~   # not ported
        decision_log: >
          Not implemented in Python. Corrected 2026-08-28: this previously read
          "Python: (partial implementation)", but BinaryTable has no insert_row
          at all -- there is nothing partial about it. MATLAB uses 'rb' for the
          read operations during insert. See "Not Yet Ported" in
          PORTING_INSTRUCTIONS.md.

      - name: deleteRow
        python_name: ~   # not ported
        decision_log: >
          MATLAB: deleteRow(). Python: (not fully implemented).
          Synchronized 2026-03-15.

      - name: writeEntry
        python_name: ~   # not ported
        decision_log: >
          MATLAB: writeEntry(). Python: (not fully implemented).
          Synchronized 2026-03-15.

      - name: writeTable
        python_name: ~   # not ported
        decision_log: >
          MATLAB: writeTable(). Python: (not fully implemented).
          Synchronized 2026-03-15.

      - name: findRow
        python_name: ~   # not ported
        decision_log: >
          MATLAB: findRow(). Python: (not fully implemented).
          Synchronized 2026-03-15.

    decision_log: >
      OUT OF SYNC. Python BinaryTable has basic read functionality but
      is missing several write methods (insertRow, deleteRow, writeEntry,
      writeTable, findRow). MATLAB also changed all read permissions to
      'rb'. Partial port — needs completion.

  # -----------------------------------------------------------------------
  # did.file.fileCache
  # -----------------------------------------------------------------------
  - name: fileCache
    type: class
    matlab_path: "+did/+file/fileCache.m"
    matlab_last_sync_hash: "3aa892d"
    python_path: "did/file.py"
    python_class: "FileCache"
    inherits_matlab: "handle"
    out_of_sync: true
    out_of_sync_reason: >
      Not a MATLAB-side divergence -- MATLAB has not touched fileCache.m since
      3aa892d. Three separate problems on the Python side, the third found
      2026-08-28 and the most serious.

      1. The Python class is a stub. It implements construction and
         .fileCacheInfo read/write and nothing else: no addFile, removeFile,
         isFile, fileList, resizeAndAdd, touch or clear. Nothing can be cached,
         and maxSize/reduceSize are stored but never enforced.

      2. It is duplicated. There are two unrelated classes named FileCache --
         did/file.py:FileCache (the stub above) and did/common.py:FileCache (a
         three-line placeholder holding only path and size). did.common.
         get_cache() returns the common.py placeholder, so the object
         DID-python hands callers is the emptier of the two, where MATLAB's
         getCache() returns a working did.file.fileCache.

      3. THE ON-DISK FORMATS ARE INCOMPATIBLE UNDER THE SAME FILENAME. Both
         languages call the cache index ".fileCacheInfo". MATLAB writes it
         through binaryTable as a fixed binary layout: a 26-byte header
         (fileNameCharacters as uint16, then maxSize, reduceSize and
         currentSize as uint64) followed by fixed-width rows of
         {char[fileNameCharacters], double, uint64} -- filename, last-accessed
         time, size. Python writes JSON. Neither can read the other's file:
         Python's _load_properties would raise on MATLAB's binary, and MATLAB's
         readHeader would misparse Python's JSON.

      This matters because MATLAB's cache is not a side feature: sqlitedb.
      do_open_doc consults filecachepath when opening a document's binary file
      and calls touch() on a hit.

      The two languages do not collide today only because their filecachepath
      values differ -- see the PathConstants.filecachepath entry in
      did_matlab_python_bridge_util.yaml. That is the accident keeping this
      latent, not a design.

      ORDER OF WORK: align the format BEFORE aligning the path. Making the
      paths agree first -- which looks like a one-line fix and which the bridge
      previously implied was already true -- would point both languages at one
      directory in which each corrupts the other's index.

    properties:
      - name: directoryName
        python_name: directory_name
        type_matlab: "char"
        type_python: "str"
        python_name: "directory_name"
        decision_log: "Exact match."

      - name: fileNameCharacters
        python_name: file_name_characters
        type_matlab: "uint16"
        type_python: "int"
        python_name: "file_name_characters"
        decision_log: >
          Both default to 32. MATLAB enforces >= 32 via a property
          validator; Python does not validate.

      - name: maxSize
        python_name: max_size
        type_matlab: "uint64"
        type_python: "float"
        python_name: "max_size"
        decision_log: >
          Both default to 100e9. MATLAB enforces >= 1000 via a property
          validator; Python does not validate.

      - name: reduceSize
        python_name: reduce_size
        type_matlab: "uint64"
        type_python: "float"
        python_name: "reduce_size"
        decision_log: >
          Both default to 80e9. MATLAB enforces >= 800 via a property
          validator; Python checks only reduce_size < max_size in
          set_properties().

      - name: currentSize
        python_name: current_size
        type_matlab: "uint64"
        type_python: "float"
        python_name: "current_size"
        decision_log: "Exact match."

      - name: binaryTable
        python_name: ~   # not ported
        type_matlab: "did.file.binaryTable"
        type_python: "(not implemented)"
        decision_log: >
          MATLAB backs the cache catalog with a binaryTable. Python
          stores the catalog in the same JSON info file instead, under
          a 'files' key. Deviation by design.

      - name: cacheInfoFileName
        python_name: CACHE_INFO_FILE_NAME
        type_matlab: "constant char"
        type_python: "class constant str"
        python_name: "CACHE_INFO_FILE_NAME"
        decision_log: "Both are '.fileCacheInfo'."

    methods:
      - name: fileCache
        python_name: __init__
        kind: constructor
        decision_log: >
          MATLAB: fileCache(directoryName, fileNameCharacters, maxSize,
          reduceSize). Python: FileCache(directory_name,
          file_name_characters=32, max_size=100e9, reduce_size=80e9).
          Both load an existing .fileCacheInfo if present, otherwise
          initialize one.

      - name: setProperties
        python_name: set_properties
        python_name: "set_properties"
        decision_log: "Equivalent; both write the info file."

      - name: getProperties
        python_name: ~   # not ported
        python_name: "_load_properties"
        decision_log: >
          MATLAB returns a struct of cache info. Python's counterpart
          loads the info file into instance attributes rather than
          returning it.

      - name: addFile
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: removeFile
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: clear
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: isFile
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: fileList
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: resizeAndAdd
        python_name: ~   # not ported
        decision_log: >
          Present in MATLAB -- evicts by ascending last-access time
          until the cache is under reduceSize, then adds. Not
          implemented in Python, so the Python cache never evicts.

      - name: touch
        python_name: ~   # not ported
        decision_log: "Present in MATLAB. Not implemented in Python."

      - name: infoFileName
        python_name: _info_file_name
        python_name: "_info_file_name"
        decision_log: "Exact match."

    decision_log: >
      STUB. Promoted from not_applicable to a tracked entry on
      2026-08-28: a FileCache class does exist in Python, so
      classifying it "not applicable" both overstated the port and left
      MATLAB changes to fileCache.m invisible to the drift check. What
      exists is construction plus info-file read/write and nothing else,
      split across two same-named classes (see out_of_sync_reason). Sync
      hash set to 3aa892d, the commit the original bulk port (97ba45c)
      was taken from -- MATLAB has not changed this file since, so the
      gap is in the port, not in drift.

