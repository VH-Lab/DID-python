name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        # Pinned deliberately. These were unpinned, so when ruff widened its
        # default rule set the lint job started failing on unchanged code --
        # main went red without a commit. Bump these intentionally, with the
        # cleanup that a new version's findings require, rather than letting a
        # release land mid-PR.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.5 black==26.5.1

      - name: Check formatting with black
        run: black --check src/ tests/

      - name: Lint with ruff
        run: ruff check src/ tests/

  bridge:
    name: Bridge coverage vs DID-matlab
    runs-on: ubuntu-latest
    steps:
      - name: Check out DID-python
        uses: actions/checkout@v4

      - name: Check out DID-matlab
        uses: actions/checkout@v4
        with:
          repository: VH-Lab/DID-matlab
          path: DID-matlab
          fetch-depth: 0   # drift check walks history from each sync hash

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # These four checks depend only on the current state of the two repos,
      # so a PR can break them and a PR can fix them. They gate.
      - name: Check bridge coverage
        run: |
          python bin/check_bridge_coverage.py \
            --matlab-repo DID-matlab \
            --check file --check hash --check member --check missing

      # Drift is different: it turns red when DID-matlab moves, which no commit
      # here causes and no commit here can fix until someone does the port. Kept
      # visible but non-gating, so main does not go red without a commit.
      - name: Report MATLAB drift (informational)
        continue-on-error: true
        run: |
          python bin/check_bridge_coverage.py \
            --matlab-repo DID-matlab --check drift

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: pytest

  wheel-smoke:
    # A pytest run imports from the source tree, so it cannot catch missing
    # package DATA (example_schema/*.json) in the built distribution. Build a
    # wheel, install it into a clean environment, and construct a document from
    # OUTSIDE the repo so a broken package-data config fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel and construct a document from outside the repo
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from did.document import Document; Document('demoA'); Document('base'); print('wheel smoke OK')"
