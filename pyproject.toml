[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "did"
version = "0.1.0"
description = "A Python port of the VH-Lab/DID-matlab project"
readme = "README.md"
authors = [
  { name = "Author", email = "vanhoosr@brandeis.edu" },
]
dependencies = [
    "numpy>=1.20",
    "pandas>=2.0,<4",
    "portalocker>=2.0",
    "networkx>=2.6",
    "matplotlib>=3.5",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "symmetry: cross-language symmetry tests (MATLAB <-> Python)",
    "make_artifacts: tests that generate artifacts for symmetry testing",
    "read_artifacts: tests that read and validate artifacts from another implementation",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Ship the example schema/document JSON in the built distribution. Without this
# a pip-installed `did` has no example_schema/ under site-packages, so
# PathConstants.DEFPATH points at a nonexistent directory and Document('demoA')
# raises FileNotFoundError. example_schema/ is a data directory (no __init__.py),
# so packages.find does not discover it and its JSON must be declared here.
[tool.setuptools.package-data]
"did" = ["example_schema/**/*.json"]

[tool.setuptools]
include-package-data = true
